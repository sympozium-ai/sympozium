name: Release CLI

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      force_starter_rebuild:
        description: Build a new Celln starter package even when its inputs are unchanged
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish (run this from that tag)
        required: true
        type: string
      force_starter_rebuild:
        description: Build a new Celln starter package even when its inputs are unchanged. Upgrading to the release then replaces the fleet's package and ends every live parent
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io/sympozium-ai/sympozium
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  native-artifacts:
    uses: ./.github/workflows/native-artifacts.yaml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      publish: true
    secrets: inherit

  # ── Default Celln starter package ─────────────────────────────────────────────
  # Built from the pinned Celln, signed with a key generated here and
  # discarded, published as a digest-pinned image, and embedded into the CLI so
  # `sympozium install` pins it. The trust is the publisher key and package
  # hash the installer approves, recorded in the release assets.
  #
  # A fleet scope carries one package, and moving it ends every live parent,
  # so a release only builds a package when its inputs changed
  # (hack/celln-starter-inputs.sh). Otherwise it republishes the previous
  # release's identity unchanged and an upgrade keeps the fleet's package.
  release-starter-package:
    runs-on: ubuntu-latest
    outputs:
      starter: ${{ steps.starter.outputs.json }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the previous release's package when the inputs are unchanged
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_starter_rebuild || false }}
        run: |
          fingerprint="$(hack/celln-starter-inputs.sh)"
          hack/celln-starter-inputs.sh --manifest
          echo "package inputs: $fingerprint"
          if [ "$FORCE_REBUILD" = true ]; then
            echo "building: force_starter_rebuild was set"
            exit 0
          fi
          # The newest published release that is not the one being made.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 30 --json tagName \
            --jq "[.[].tagName | select(. != \"${RELEASE_TAG}\")][0] // \"\"" || true)"
          mkdir -p starter/previous
          if [ -n "$previous" ]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern celln-starter.json --dir starter/previous ||
              echo "release $previous carries no celln-starter.json"
          fi
          if hack/celln-starter-reuse.sh --check-image starter/previous/celln-starter.json "$fingerprint" >celln-starter.json; then
            echo "reusing starter package from $previous: inputs unchanged"
            cat celln-starter.json
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            # The installer pins the digest; the release tag is a convenience.
            docker buildx imagetools create --tag "${{ env.REGISTRY }}/celln-starter:${RELEASE_TAG}" "$(jq -r .image celln-starter.json)" ||
              echo "::warning::could not tag the reused package image with ${RELEASE_TAG}; the digest is what the installer pins"
          else
            rm -f celln-starter.json
          fi

      - name: Install packaging tools
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo e2fsprogs cpio gcc jq
          # celln runs mke2fs and debugfs with PATH=/usr/bin:/bin; Debian keeps
          # them under /usr/sbin (Fedora's merged sbin hid this locally).
          for tool in mke2fs debugfs; do
            [ -x "/usr/bin/$tool" ] || sudo ln -s "$(command -v "$tool")" "/usr/bin/$tool"
          done

      - name: Read pinned Celln release
        id: celln
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          pin=config/celln/release.json
          jq -e '.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")' "$pin"
          jq -e '.archiveSHA256 | test("^[a-f0-9]{64}$")' "$pin"
          {
            echo "version=$(jq -r .version "$pin")"
            echo "sha256=$(jq -r .archiveSHA256 "$pin")"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned Celln bundle
        if: steps.reuse.outputs.reuse != 'true'
        env:
          CELLN_VERSION: ${{ steps.celln.outputs.version }}
          CELLN_SHA256: ${{ steps.celln.outputs.sha256 }}
        run: |
          mkdir -p starter/bundle
          curl --fail --location --retry 3 \
            "https://github.com/sympozium-ai/celln/releases/download/${CELLN_VERSION}/celln-x86_64-unknown-linux-musl.tar.gz" \
            --output starter/celln.tar.gz
          printf '%s  starter/celln.tar.gz\n' "$CELLN_SHA256" | sha256sum --check
          tar -xzf starter/celln.tar.gz -C starter/bundle
          # The guest kernel: the runner's own when it ships one, else a
          # stock virtual kernel from the archive. Readable only by root.
          kernel="$(ls /boot/vmlinuz-* 2>/dev/null | head -1 || true)"
          if [ -z "$kernel" ]; then
            sudo apt-get install -y --no-install-recommends linux-image-virtual
            kernel="$(ls /boot/vmlinuz-* | head -1)"
          fi
          sudo cp "$kernel" starter/vmlinuz && sudo chown "$(id -u)" starter/vmlinuz

      - name: Build, sign and publish the package
        if: steps.reuse.outputs.reuse != 'true'
        env:
          CELLN_VERSION: ${{ steps.celln.outputs.version }}
        run: |
          hack/build-celln-starter.sh --bundle starter/bundle --kernel starter/vmlinuz \
            --image "${{ env.REGISTRY }}/celln-starter:${RELEASE_TAG}" --out starter/out --push
          cp starter/out/starter.json celln-starter.json

      - name: Record the package identity
        id: starter
        run: |
          jq -e '.image | test("@sha256:[a-f0-9]{64}$")' celln-starter.json
          jq -e '.packageHash | test("^blake3:[a-f0-9]{64}$")' celln-starter.json
          jq -e '.inputs | test("^sha256:[a-f0-9]{64}$")' celln-starter.json
          echo "json=$(jq -c . celln-starter.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: celln-starter
          path: celln-starter.json

      - name: Upload the package identity to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: celln-starter.json

  release-cli:
    needs: release-starter-package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pin the default starter package
        uses: actions/download-artifact@v4
        with:
          name: celln-starter
          path: starter

      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          starter=starter/celln-starter.json
          jq -e '.image | test("@sha256:[a-f0-9]{64}$")' "$starter"
          jq -e '.packageHash | test("^blake3:[a-f0-9]{64}$")' "$starter"
          VERSION="${RELEASE_TAG}"
          pin="-X main.cellnStarterImage=$(jq -r .image "$starter") -X main.cellnStarterHash=$(jq -r .packageHash "$starter") -X main.cellnStarterPublisher=$(jq -r .publisher "$starter") -X main.cellnStarterCellnVersion=$(jq -r .cellnVersion "$starter")"
          go build -ldflags="-s -w -X main.version=${VERSION} ${pin}" \
            -o sympozium ./cmd/sympozium

      - name: Package
        run: |
          PLATFORM="${{ matrix.goos }}-${{ matrix.goarch }}"
          tar -czf "sympozium-${PLATFORM}.tar.gz" sympozium
          sha256sum "sympozium-${PLATFORM}.tar.gz" > "sympozium-${PLATFORM}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            sympozium-*.tar.gz
            sympozium-*.sha256

  release-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - agent-runner
          - controller
          - apiserver
          - ipc-bridge
          - webhook
          - channel-telegram
          - channel-whatsapp
          - channel-discord
          - channel-slack
          - skill-k8s-ops
          - skill-sre-observability
          - skill-github-gitops
          - skill-llmfit
          - skill-memory
          - mcp-bridge
          - web-proxy
          - model-gateway
          - node-probe
          - llmfit-daemon
          - harness-reference
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image }}"
          TAGS="${IMAGE}:${TAG},${IMAGE}:${VERSION},${IMAGE}:${MAJOR_MINOR},${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            IMAGE_TAG=${{ env.RELEASE_TAG }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The celln host-installer is amd64-only (its base Celln image has no ARM64
  # bundle) and layers a Rust toolchain, so it is built separately from the
  # ordinary multi-arch fleet.
  release-celln-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read pinned Celln release
        id: celln
        run: |
          pin=config/celln/release.json
          jq -e '.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")' "$pin"
          jq -e '.imageDigest | test("^sha256:[a-f0-9]{64}$")' "$pin"
          echo "image=ghcr.io/sympozium-ai/celln@$(jq -r .imageDigest "$pin")" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"
          IMAGE="${{ env.REGISTRY }}/celln-installer"
          TAGS="${IMAGE}:${TAG},${IMAGE}:${VERSION},${IMAGE}:${MAJOR_MINOR},${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/celln-installer/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            CELLN_IMAGE=${{ steps.celln.outputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=celln-installer
          cache-to: type=gha,mode=max,scope=celln-installer

  # ── Sync Helm chart with release ──────────────────────────────────────────────
  release-helm-chart:
    name: Sync Helm chart
    needs: [release-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync CRDs to Helm charts
        run: |
          echo "Syncing CRDs to charts/sympozium/crds/..."
          mkdir -p charts/sympozium/crds
          cp config/crd/bases/*.yaml charts/sympozium/crds/
          echo "Syncing CRDs to charts/sympozium-crds/templates/..."
          mkdir -p charts/sympozium-crds/templates
          rm -f charts/sympozium-crds/templates/sympozium.ai_*.yaml
          cp config/crd/bases/*.yaml charts/sympozium-crds/templates/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          git diff --cached --quiet && echo "No chart changes" && exit 0
          git commit -m "chore: sync Helm chart CRDs for ${RELEASE_TAG}"
          git push origin main

  # ── Publish Helm chart to GitHub Release ─────────────────────────────────────
  publish-helm-chart:
    name: Publish Helm chart package
    needs: release-helm-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package charts
        run: |
          # Bundled llmfit-dra dependency (Chart.lock) — resolve before packaging.
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm dependency build charts/sympozium
          helm package charts/sympozium-crds --destination .helm-packages
          helm package charts/sympozium      --destination .helm-packages

      - name: Upload charts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # One glob: the first already matches the CRD chart, and listing it
          # twice uploaded it twice at once, the second racing the first and
          # leaving the release without it (v0.10.70).
          files: .helm-packages/sympozium-*.tgz

      - name: Trigger docs rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml

  # ── Update Homebrew tap ──────────────────────────────────────────────────────
  update-homebrew:
    name: Update Homebrew tap
    needs: release-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: sympozium-ai/homebrew-sympozium
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release assets and update formula
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${TAG#v}"

          declare -A SHAS
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            URL="https://github.com/sympozium-ai/sympozium/releases/download/${TAG}/sympozium-${platform}.tar.gz"
            echo "Hashing ${URL}..."
            SHA=$(curl -fsSL "${URL}" | shasum -a 256 | awk '{print $1}')
            SHAS[$platform]="${SHA}"
            echo "  ${platform}: ${SHA}"
          done

          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/sympozium.rb << RUBY
          class Sympozium < Formula
            desc "Kubernetes-native AI agent orchestration platform CLI"
            homepage "https://github.com/sympozium-ai/sympozium"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/sympozium-ai/sympozium/releases/download/v#{version}/sympozium-darwin-arm64.tar.gz"
                sha256 "${SHAS[darwin-arm64]}"
              else
                url "https://github.com/sympozium-ai/sympozium/releases/download/v#{version}/sympozium-darwin-amd64.tar.gz"
                sha256 "${SHAS[darwin-amd64]}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/sympozium-ai/sympozium/releases/download/v#{version}/sympozium-linux-arm64.tar.gz"
                sha256 "${SHAS[linux-arm64]}"
              else
                url "https://github.com/sympozium-ai/sympozium/releases/download/v#{version}/sympozium-linux-amd64.tar.gz"
                sha256 "${SHAS[linux-amd64]}"
              end
            end

            def install
              bin.install "sympozium"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sympozium version")
            end
          end
          RUBY

          # Fix heredoc indentation
          sed -i 's/^          //' homebrew-tap/Formula/sympozium.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sympozium.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update sympozium to ${RELEASE_TAG}"
          git push origin HEAD:main
