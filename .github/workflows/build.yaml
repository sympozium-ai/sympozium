name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/sympozium-ai/sympozium

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'images/**'
              - 'web/**'
              - '.github/workflows/build.yaml'
              - '.github/workflows/native-artifacts.yaml'
              - 'config/host/**'
              - 'config/celln/**'

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format #503 model-budget package
        if: github.event_name == 'pull_request' && github.head_ref == 'celln-tenancy/08-model-budget-503'
        run: |
          git fetch origin "$GITHUB_HEAD_REF:$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
          gofmt -s -w internal/modelbudget
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/modelbudget
          if ! git diff --cached --quiet; then
            git commit -m 'style: gofmt Celln model-budget ledger'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
      - name: Check formatting
        run: |
          unformatted=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -short ./...
      - name: Check generated code is up to date
        run: |
          make generate
          if ! git diff --quiet; then
            echo "::error::Generated code is out of date. Run 'make generate' and commit the changes."
            git diff --stat
            exit 1
          fi
      - name: Check Helm chart CRDs in sync
        run: make helm-sync-check

  native-artifacts:
    needs: [changes, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/native-artifacts.yaml
    permissions:
      contents: write
      packages: write
    with:
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true') || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        image: [agent-runner, controller, apiserver, ipc-bridge, webhook, web-proxy, channel-telegram, channel-whatsapp, channel-discord, channel-slack, skill-k8s-ops, skill-sre-observability, skill-github-gitops, skill-llmfit, skill-memory, mcp-bridge, node-probe, llmfit-daemon, harness-reference]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-celln-installer:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Read pinned Celln release
        id: celln
        run: |
          pin=config/celln/release.json
          jq -e '.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")' "$pin"
          jq -e '.imageDigest | test("^sha256:[a-f0-9]{64}$")' "$pin"
          echo "image=ghcr.io/sympozium-ai/celln@$(jq -r .imageDigest "$pin")" >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/celln-installer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/celln-installer/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            CELLN_IMAGE=${{ steps.celln.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=celln-installer
          cache-to: type=gha,mode=max,scope=celln-installer
