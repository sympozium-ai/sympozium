name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/sympozium-ai/sympozium

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'images/**'
              - 'web/**'
              - '.github/workflows/build.yaml'
              - '.github/workflows/native-artifacts.yaml'
              - 'config/host/**'
              - 'config/celln/**'

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Correct #496 secret source ownership and regenerate bundle
        if: github.event_name == 'pull_request' && github.head_ref == 'contract/celln-namespace-authorisation-496'
        run: |
          git fetch origin "$GITHUB_HEAD_REF:$GITHUB_HEAD_REF"
          git checkout "$GITHUB_HEAD_REF"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cmd/celln-authorisation-fixture/model_types.go')
          s = p.read_text()
          old = '''type CredentialSource struct {
          \tKind       string `json:"kind"`
          \tSecretUID  string `json:"secretUid"`
          \tSecretName string `json:"secretName"`
          \tSecretKey  string `json:"secretKey"`
          }'''
          new = '''type CredentialSource struct {
          \tKind       string `json:"kind"`
          \tSecretName string `json:"secretName"`
          \tSecretKey  string `json:"secretKey"`
          }'''
          if old not in s:
              raise SystemExit('model credential-source shape not found')
          p.write_text(s.replace(old, new))

          p = Path('cmd/celln-authorisation-fixture/fixture_cases.go')
          s = p.read_text()
          old = 'CredentialSource: &CredentialSource{Kind: "Secret", SecretUID: "secret-uid-1", SecretName: "model-key", SecretKey: "apiKey"}'
          new = 'CredentialSource: &CredentialSource{Kind: "Secret", SecretName: "model-key", SecretKey: "apiKey"}'
          if old not in s:
              raise SystemExit('fixture secret UID source not found')
          p.write_text(s.replace(old, new))

          p = Path('cmd/celln-authorisation-fixture/fixture_schema.go')
          s = p.read_text()
          old = '\"credentialSource\":{\"type\":\"object\",\"additionalProperties\":false,\"required\":[\"kind\",\"secretUid\",\"secretName\",\"secretKey\"],\"properties\":{\"kind\":{\"const\":\"Secret\"},\"secretUid\":{\"$ref\":\"#/$defs/id\"},\"secretName\":{\"$ref\":\"#/$defs/id\"},\"secretKey\":{\"$ref\":\"#/$defs/id\"}}}'
          new = '\"credentialSource\":{\"type\":\"object\",\"additionalProperties\":false,\"required\":[\"kind\",\"secretName\",\"secretKey\"],\"properties\":{\"kind\":{\"const\":\"Secret\"},\"secretName\":{\"$ref\":\"#/$defs/id\"},\"secretKey\":{\"$ref\":\"#/$defs/id\"}}}'
          if old not in s:
              raise SystemExit('schema secret UID shape not found')
          p.write_text(s.replace(old, new))

          p = Path('docs/design/celln-namespace-authorisation.md')
          s = p.read_text()
          s = s.replace('retarget an existing run to a different namespace UID, ModelConnection, Secret\nUID, parent incarnation, runtime or tool revision.', 'retarget an existing run to a different namespace UID, ModelConnection,\nparent incarnation, runtime or tool revision.')
          old = '''A model route binds provider, protocol, model, endpoint origin, ModelConnection
UID/spec digest, auth mode and (for secret-backed routes) Secret UID/name/key.
The resolver does not read Secret contents.

The dedicated gateway pins and revalidates the actual source identity. Secret
data may rotate within the same Secret UID; deleting/recreating the Secret or
changing route identity does not retarget an active run.'''
          new = '''A model route binds provider, protocol, model, endpoint origin, ModelConnection
UID/spec digest, auth mode and (for secret-backed routes) the Secret name/key
reference. The resolver does not read the Secret object or its contents.

During authenticated route/budget registration, the dedicated model gateway
resolves that reference, pins the actual Secret UID beside the immutable
decision/budget identity, and returns only non-secret binding metadata. Before
each provider admission it rechecks that live UID. Secret data may rotate within
the same Secret UID; deleting/recreating the same-name Secret or changing route
identity does not retarget an active run.'''
          if old not in s:
              raise SystemExit('model route doc section not found')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w cmd/celln-authorisation-fixture/model_types.go cmd/celln-authorisation-fixture/fixture_cases.go cmd/celln-authorisation-fixture/fixture_schema.go
          go run ./cmd/celln-authorisation-fixture gen -fixtures test/fixtures/celln-authorisation/v1
          go run ./cmd/celln-authorisation-fixture verify -fixtures test/fixtures/celln-authorisation/v1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/celln-authorisation-fixture docs/design/celln-namespace-authorisation.md test/fixtures/celln-authorisation/v1
          if ! git diff --cached --quiet; then
            git commit -m 'contract(celln): make resolver secret-blind for #498'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi

      - name: Check formatting
        run: |
          unformatted=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -short ./...
      - name: Check generated code is up to date
        run: |
          make generate
          if ! git diff --quiet; then
            echo "::error::Generated code is out of date. Run 'make generate' and commit the changes."
            git diff --stat
            exit 1
          fi
      - name: Check Helm chart CRDs in sync
        run: make helm-sync-check

  native-artifacts:
    needs: [changes, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/native-artifacts.yaml
    permissions:
      contents: write
      packages: write
    with:
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true') || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        image: [agent-runner, controller, apiserver, ipc-bridge, webhook, web-proxy, channel-telegram, channel-whatsapp, channel-discord, channel-slack, skill-k8s-ops, skill-sre-observability, skill-github-gitops, skill-llmfit, skill-memory, mcp-bridge, node-probe, llmfit-daemon, harness-reference]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-celln-installer:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Read pinned Celln release
        id: celln
        run: |
          pin=config/celln/release.json
          jq -e '.version | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")' "$pin"
          jq -e '.imageDigest | test("^sha256:[a-f0-9]{64}$")' "$pin"
          echo "image=ghcr.io/sympozium-ai/celln@$(jq -r .imageDigest "$pin")" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/celln-installer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/celln-installer/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            CELLN_IMAGE=${{ steps.celln.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=celln-installer
          cache-to: type=gha,mode=max,scope=celln-installer
