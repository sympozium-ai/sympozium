site_name: Sympozium
site_url: https://deploy.sympozium.ai/docs/
site_description: Kubernetes-native AI Agent Management Platform
site_author: Alex Jones
repo_url: https://github.com/sympozium-ai/sympozium
repo_name: sympozium-ai/sympozium
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg

plugins:
  - search
  - redirects:
      redirect_maps:
        guides/celln-catalogue-controller-bridge.md: design/history/celln-catalogue-controller-bridge.md
        guides/celln-durable-issuance-cli.md: design/history/celln-durable-issuance-cli.md
        guides/celln-enduring-run.md: design/history/celln-enduring-run.md
        guides/celln-framework-manual-review.md: design/history/celln-framework-manual-review.md
        guides/celln-harness-selection-ux.md: design/history/celln-harness-selection-ux.md
        guides/celln-interactive-session.md: design/history/celln-interactive-session.md
        guides/celln-issuer-client.md: design/history/celln-issuer-client.md
        guides/celln-issuer-service.md: design/history/celln-issuer-service.md
        guides/celln-issuer-systemd.md: design/history/celln-issuer-systemd.md
        guides/celln-json-harness.md: design/history/celln-json-harness.md
        guides/celln-live-catalogue-proof.md: design/history/celln-live-catalogue-proof.md
        guides/celln-local-issuance.md: design/history/celln-local-issuance.md
        guides/celln-mlp-acceptance.md: design/history/celln-mlp-acceptance.md
        guides/celln-mlp-borrowed-tools.md: design/history/celln-mlp-borrowed-tools.md
        guides/celln-mlp-installation.md: design/history/celln-mlp-installation.md
        guides/celln-mlp-kind-network.md: design/history/celln-mlp-kind-network.md
        guides/celln-mlp-troubleshooting.md: design/history/celln-mlp-troubleshooting.md
        guides/celln-model-authority.md: design/history/celln-model-authority.md
        guides/celln-parent-hands-on.md: design/history/celln-parent-hands-on.md
        guides/celln-parent-only-controller.md: design/history/celln-parent-only-controller.md
        guides/celln-permission-preview.md: design/history/celln-permission-preview.md
        guides/celln-reference-harness.md: design/history/celln-reference-harness.md
        guides/celln-registered-issuance.md: design/history/celln-registered-issuance.md
        guides/celln-router-deployment.md: design/history/celln-router-deployment.md
        guides/celln-router-execution-client.md: design/history/celln-router-execution-client.md
        guides/celln-router-prewarm-client.md: design/history/celln-router-prewarm-client.md
        guides/celln-runtime-profile.md: design/history/celln-runtime-profile.md
        guides/celln-tenancy-migration.md: design/history/celln-tenancy-migration.md
        guides/celln-tool-authority.md: design/history/celln-tool-authority.md
        guides/celln-tool-catalogue.md: design/history/celln-tool-catalogue.md
        guides/celln-tool-review.md: design/history/celln-tool-review.md
        architecture-simplified.md: design/history/architecture-simplified.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sympozium-ai/sympozium

copyright: Copyright &copy; 2024-2026 Alex Jones — MIT License

