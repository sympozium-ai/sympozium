---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: modelconnections.sympozium.ai
spec:
  group: sympozium.ai
  names:
    kind: ModelConnection
    listKind: ModelConnectionList
    plural: modelconnections
    singular: modelconnection
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelConnection describes a model route, not a grant to execute it.
          The independent host policy must admit the same endpoint and credential profile.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowInsecure:
                description: |-
                  AllowInsecure permits an HTTP or self-signed HTTPS endpoint on a private
                  address. This is an explicit operator opt-in that weakens the default
                  public-HTTPS transport contract. It never bypasses host admission.
                type: boolean
              credentialProfile:
                description: CredentialProfile is an opaque host mapping name, never
                  an API key or file path.
                pattern: ^[a-zA-Z0-9_-]{1,64}$
                type: string
              disabled:
                description: Disabled prevents new connection resolution. Host profile
                  withdrawal stops live use.
                type: boolean
              endpoint:
                description: Endpoint is an HTTP(S) API base URL or full request URL.
                  Native Celln requires a full HTTPS request URL.
                maxLength: 2048
                type: string
              maxOutputTokens:
                description: |-
                  MaxOutputTokens bounds the output tokens one model request through this
                  connection may ask for. Omitted means 512. The model gateway refuses a
                  request above it; a turn's own output-token cap still applies. Only
                  gateway-mediated connections (secretRef or no credential) may set it.
                format: int64
                maximum: 4096
                minimum: 256
                type: integer
              models:
                description: Models lists the exact model identifiers selectable through
                  this connection.
                items:
                  type: string
                maxItems: 128
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              parameters:
                description: |-
                  Parameters is a bounded JSON object the model gateway merges into every
                  provider request made through this connection, for example
                  {"temperature":0.7} or {"chat_template_kwargs":{"enable_thinking":false}}.
                  It is operator policy pinned on the host side: the guest never sees it, a
                  guest request that carries one of its keys is refused, and request fields
                  the gateway owns (ReservedModelParameters) cannot be set. At most 16
                  top-level keys matching ^[a-z][a-z0-9_]{0,63}$, 3 levels deep and 2048
                  bytes (ValidateModelParameters). Only gateway-mediated connections
                  (secretRef or no credential) may set it.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              protocol:
                description: Protocol selects the host adapter. Compatible gateways
                  may expose other providers.
                enum:
                - openai-chat
                - anthropic-messages
                type: string
              provider:
                description: Provider is a descriptive provider identifier, including
                  custom providers.
                pattern: ^[a-zA-Z0-9_-]{1,64}$
                type: string
              secretRef:
                description: SecretRef selects a Kubernetes credential Secret for
                  container harnesses.
                type: string
            required:
            - endpoint
            - models
            - protocol
            - provider
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
