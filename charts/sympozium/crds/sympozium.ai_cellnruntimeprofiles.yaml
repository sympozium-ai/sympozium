---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: cellnruntimeprofiles.sympozium.ai
spec:
  group: sympozium.ai
  names:
    kind: CellnRuntimeProfile
    listKind: CellnRuntimeProfileList
    plural: cellnruntimeprofiles
    singular: cellnruntimeprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.revision
      name: Revision
      type: string
    - jsonPath: .spec.contractVersion
      name: Contract
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CellnRuntimeProfileSpec is executable platform catalogue authority. A
              revision is immutable; changing any executable identity or constraint requires
              publishing a new object/revision.
            properties:
              closure:
                properties:
                  hash:
                    maxLength: 71
                    pattern: ^blake3:[0-9a-f]{64}$
                    type: string
                required:
                - hash
                type: object
              contractVersion:
                enum:
                - celln.reference-functions/v1
                - celln.json-tools/v1
                type: string
              entryPoint:
                maxLength: 256
                pattern: ^/([A-Za-z0-9_-][A-Za-z0-9_.+-]*/)*[A-Za-z0-9_-][A-Za-z0-9_.+-]*$
                type: string
              executable:
                properties:
                  hash:
                    maxLength: 71
                    pattern: ^blake3:[0-9a-f]{64}$
                    type: string
                required:
                - hash
                type: object
              json:
                description: CellnHarnessJSONLimits are explicit bounded loop ceilings,
                  not model grants.
                properties:
                  maxCalls:
                    format: int64
                    maximum: 16
                    minimum: 0
                    type: integer
                  maxTurns:
                    format: int64
                    maximum: 6
                    minimum: 1
                    type: integer
                required:
                - maxCalls
                - maxTurns
                type: object
              lane:
                enum:
                - agent
                type: string
              lifecycles:
                items:
                  enum:
                  - disposable-one-shot
                  - enduring
                  type: string
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              limits:
                description: |-
                  AgentRuntimeCellnLimits are ceilings, never Agent grants or provider policy.
                  Model mediation and tools retain their selected adapter's dispatch contract;
                  this profile cannot add protocols, tools or destinations.
                properties:
                  memoryBytes:
                    format: int64
                    maximum: 268435456
                    minimum: 1
                    type: integer
                  outputBytes:
                    format: int64
                    maximum: 65536
                    minimum: 1
                    type: integer
                  taskBytes:
                    format: int64
                    maximum: 2048
                    minimum: 1
                    type: integer
                  timeoutMillis:
                    format: int64
                    maximum: 300000
                    minimum: 1
                    type: integer
                  workspace:
                    enum:
                    - none
                    type: string
                required:
                - memoryBytes
                - outputBytes
                - taskBytes
                - timeoutMillis
                - workspace
                type: object
              mote:
                properties:
                  hash:
                    maxLength: 71
                    pattern: ^blake3:[0-9a-f]{64}$
                    type: string
                required:
                - hash
                type: object
              platform:
                enum:
                - linux/amd64
                type: string
              publisherKey:
                maxLength: 64
                pattern: ^[0-9a-f]{64}$
                type: string
              revision:
                maxLength: 64
                minLength: 1
                type: string
            required:
            - closure
            - contractVersion
            - entryPoint
            - executable
            - lane
            - lifecycles
            - limits
            - mote
            - platform
            - publisherKey
            - revision
            type: object
            x-kubernetes-validations:
            - message: runtime lifecycles must be unique
              rule: self.lifecycles.all(x, self.lifecycles.filter(y, y == x).size()
                == 1)
            - message: JSON loop ceilings must match the selected adapter contract
              rule: 'self.contractVersion == ''celln.json-tools/v1'' ? has(self.json)
                : !has(self.json)'
          status:
            properties:
              conditions:
                description: |-
                  Conditions may describe publication/distribution observations but never
                  constitute execution admission for a tenant run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: runtime profile revisions are immutable; publish a new revision
          rule: self.spec == oldSelf.spec
    served: true
    storage: true
    subresources:
      status: {}
