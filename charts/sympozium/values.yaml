# -- Global image settings
image:
  registry: ghcr.io/sympozium-ai/sympozium
  pullPolicy: IfNotPresent
  # -- Override the image tag (defaults to .Chart.AppVersion)
  tag: ""
  # -- Utility images injected by the controller and the chart. Point them at a
  # private mirror for air-gapped clusters (#348).
  utility:
    # -- wait-for-memory, wait-for-shared-memory and postRun done containers
    busybox: busybox:1.36
    # -- pre-delete hook that strips finalizers
    kubectl: soldevelo/kubectl:1.36

# Dedicated gateway component only; does not enable mediated Celln admission
# (celln.mediation.enabled does, and then deploys this gateway itself, from
# Secret/ConfigMap volumes, without `enabled` or `configurationClaim` here).
# Operator-provisioned claim holds gateway.json, public JWKS, TLS and static
# registration/database credential files. No issuer private keys/provider keys.
modelGateway:
  enabled: false
  image: "" # required immutable repository@sha256:digest
  configurationClaim: "" # files readable by UID 65532; secret files mode 0600
  # -- NetworkPolicy egress rules for the gateway. Empty allows any
  # destination: an Agent may use any provider, and the gateway still binds
  # each call to that Agent's route and key. Set a list (DNS, Kubernetes API,
  # providers) to restrict it.
  egress: []
  # -- Used with celln.mediation.enabled, which deploys this gateway from
  # Secret/ConfigMap volumes instead of configurationClaim. Set secretName to
  # an operator-provided Secret in the control-plane namespace holding the
  # PostgreSQL connection URL (migrations 002 and 003 applied). Left empty,
  # the chart runs its own single-pod PostgreSQL (`bundled` below).
  database:
    secretName: ""
    key: database-url
    # -- The chart's own PostgreSQL, used only with celln.mediation and no
    # secretName. One pod on a PVC; it holds budget accounting and gateway
    # registrations, never provider keys. Its password is generated once and
    # kept across upgrades. Traffic stays in-cluster without TLS, and a
    # NetworkPolicy admits only the gateway. Use your own database for
    # production. The gateway applies migrations 002 and 003 on each start.
    bundled:
      image: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 # 17.11-alpine
      storage: 1Gi
      # -- Empty uses the cluster's default StorageClass.
      storageClassName: ""
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  # -- Tenant namespaces whose ModelConnections and provider Secrets the
  # gateway may read. Empty keeps the cluster-wide `get` ClusterRole; a list
  # replaces it with one Role/RoleBinding per namespace (least privilege).
  # celln.mediation also sets the gateway's readinessNamespaces from it; with
  # configurationClaim, put the same list in your gateway.json or readiness
  # keeps probing cluster-wide access and fails.
  namespaces: []
  # -- Exact provider origins on private addresses the gateway may reach
  # (gateway.json privateOrigins). Only honoured with celln.mediation.
  privateOrigins: []
  # -- Extra CA the gateway trusts for HTTPS providers listed in
  # privateOrigins, e.g. an in-house model server with a private CA. A
  # ConfigMap in the gateway's namespace; the system roots still apply, and
  # public providers never trust it. Only honoured with celln.mediation.
  providerCA:
    configMap: ""
    key: ca.crt

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Namespace to deploy into (created if it doesn't exist)
createNamespace: true
namespace: sympozium-system

# -- Controller (reconciles CRDs, manages agent pods)
controller:
  replicas: 1
  # -- Restrict the general manager to one namespace. Empty retains cluster-wide
  # watches.
  watchNamespace: ""
  # -- Alternative to watchNamespace: retain all other namespace watches while
  # reserving these namespaces for independent controllers. Not an RBAC boundary.
  excludeWatchNamespaces: []
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/controller
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  leaderElect: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- API Server (REST API for TUI/CLI and channel deployments)
apiserver:
  replicas: 1
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/apiserver
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8080
  # -- Web UI settings
  webUI:
    # -- Enable the embedded web dashboard
    enabled: true
    # -- Bearer token for API/UI authentication.
    # If empty, a random token is generated and stored in a Secret.
    # Retrieve it with: kubectl get secret <release>-ui-token -n <ns> -o jsonpath='{.data.token}' | base64 -d
    token: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Webhook (admission controller for policy enforcement)
webhook:
  enabled: true
  replicas: 2
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/webhook
    tag: ""
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- NATS JetStream (event bus for agent IPC)
nats:
  # -- Deploy built-in NATS. Set to false if using an external NATS cluster.
  enabled: true
  image:
    repository: nats
    tag: 2-alpine
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # -- External NATS URL (used when nats.enabled=false)
  externalUrl: ""
  auth:
    # -- Require credentials for the bundled NATS server. The bridge account is
    # restricted to mediated IPC subjects; all other Sympozium components use
    # the control-plane account. External NATS operators must provide an
    # equivalent subject policy themselves.
    enabled: true
    # -- Existing Secret containing `control-password` and `bridge-password`.
    # Leave empty for Helm to create and retain a random secret.
    existingSecret: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- cert-manager integration for webhook TLS
certManager:
  # -- Requires cert-manager to be installed in the cluster
  enabled: true
  issuer:
    # -- Use "ClusterIssuer" for cluster-wide, "Issuer" for namespace-scoped
    kind: Issuer
    name: sympozium-selfsigned
    selfSigned: true
  certificate:
    duration: 8760h0m0s    # 1 year
    renewBefore: 720h  # 30 days

# -- Keeps model keys out of harness pods. A harness whose policy sets
# harnessPolicy.modelMediation: required holds a per-run token; this gateway
# swaps it for the key and forwards the request. Unrelated to modelGateway,
# which serves Celln. See docs/modes/harness-adapters.md.
harnessGateway:
  enabled: false
  image:
    repository: ""                # defaults to <registry>/harness-gateway
    tag: ""
  tls:
    # -- Secret in the Sympozium namespace with tls.crt, tls.key and ca.crt,
    # valid for harness-gateway.<namespace>.svc. Empty needs certManager.enabled,
    # and the chart then issues one from its own CA. ca.crt is copied into each
    # run's token Secret, so keep the CA for longer than any run.
    secretName: ""
    # -- Lifetime of the chart's CA. Replacing it breaks runs in flight.
    caDuration: 87600h0m0s
  # -- Provider profiles appended to files/harness-gateway/profiles.yaml. A later
  # entry for a provider replaces an earlier one. Changes apply to new runs with
  # no restart. A malformed entry is skipped and logged, so its provider fails
  # closed.
  profiles: []
  # -- Variable names a profile may set, on top of
  # files/harness-gateway/allowed.yaml. Anything not listed is refused. Listing a
  # name is a decision to let it reach harness pods, so don't list one that
  # changes how a process runs, such as PATH, LD_PRELOAD or HTTPS_PROXY.
  extraAllowedEnvNames: []
  # -- Headers a profile may send the key in, on top of allowed.yaml. Don't list
  # one that changes where a request goes, such as Host.
  extraAllowedAuthHeaders: []
  # -- Provider response headers relayed to harnesses, on top of allowed.yaml.
  extraAllowedResponseHeaders: []
  # -- Origins (scheme://host[:port]) the gateway may reach on private addresses,
  # over HTTPS. The system CAs must trust them.
  privateOrigins: []
  # -- Origins the gateway may send a key to over plain HTTP, on private addresses
  # only, such as a local llama-server that has a key. The key crosses the network
  # in clear text.
  insecureOrigins: []
  # -- Calls in flight across all runs before the gateway answers 503, matching
  # the Celln gateway's default. A streaming call counts until it ends, so raise
  # this for more concurrent harnesses. No duration limit applies to a call; a
  # harness's own timeouts bound it.
  maxConcurrent: 32
  # -- Calls in flight for one run before the gateway answers 503, so one run or
  # a stolen token can't take every slot. A run that starts many subagents may
  # need more.
  maxConcurrentPerRun: 16
  # -- Tenant namespaces whose model Secrets and AgentRuns the gateway may read.
  # Empty keeps a cluster-wide get ClusterRole; a list replaces it with one
  # Role/RoleBinding per namespace (least privilege).
  namespaces: []
  # -- NetworkPolicy egress rules for the gateway. Empty allows any destination.
  # Set a list (DNS, Kubernetes API, providers) to restrict it.
  egress: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Model pricing for AgentRun cost estimation
# Accelerator power draw, read from an out-of-tree energy collector.
#
# Discovery is zero-config: any Service labelled `sympozium.ai/collector=energy`
# in one of the namespaces below is used. Installing a collector is enough — no
# further configuration, no restart. When none is present, the power surface is
# simply absent from the UI.
#
# ergoz (a collector for accelerator power draw) is the reference
# implementation and ships in `ergoz-system`; `sympozium install` deploys
# the pinned release there by default (--no-ergoz skips it). It is not privileged by
# sympozium in any way: anything serving the same fleet-snapshot shape works,
# and no implementation name appears anywhere in the controller or apiserver.
energyCollector:
  # -- Master switch for collector discovery. When false, sympozium never
  # probes for a collector and GET /api/v1/power always reports unavailable.
  enabled: true
  discovery:
    # -- Namespaces sympozium will trust a collector from.
    #
    # SECURITY: this is an allowlist, not a convenience filter. Discovery keys
    # on a label, and labels are cheap — listing collectors cluster-wide would
    # let anyone able to create a Service forge power readings. Only add
    # namespaces an administrator already controls.
    namespaces:
      - sympozium-system
      - ergoz-system

pricing:
  # -- Ship the sympozium-model-pricing ConfigMap and enable run cost
  # estimates. Estimates are display-only and never gate runs. Local
  # providers (ollama, llama-server, vllm, …) are always exempt.
  enabled: true
  # -- Extra price entries appended to the shipped defaults (same schema:
  # provider, match, inputPerMTokMicro, outputPerMTokMicro). Appended entries
  # win prefix-length ties, so put persistent local corrections here rather
  # than editing the ConfigMap (Helm upgrades overwrite it).
  extraEntries: []

# -- Persistent memory server
memory:
  # -- Admin-only DELETE /delete backstop for pruning corrupted or sensitive
  # memory entries, and GET /history for auditing every version of an entry
  # (including ones agents updated or forgot). When enabled, a bearer-token
  # Secret is generated and the controller injects it into every memory-server
  # pod (per-agent and shared workflow memory). The token is never exposed to
  # agent pods. When disabled, the Secret is absent and both endpoints return
  # 403. Reach them via `kubectl port-forward` (RBAC-gated) with
  # `Authorization: Bearer <token>`.
  adminDelete:
    enabled: true

# -- CRD installation
crds:
  # -- Install CRDs with the chart. Disable if managing CRDs separately.
  install: true

# -- RBAC
rbac:
  # -- Create ClusterRole, ClusterRoleBinding, and ServiceAccounts
  create: true

# -- Network policies for agent pod isolation
networkPolicies:
  # -- Deploy default network policies (deny-all + allow-eventbus for agents)
  enabled: true
  # -- Extra TCP egress ports to allow from agent pods.
  # Use this for clusters where the Kubernetes API server listens on a
  # non-standard port (e.g. k3s with https-listen-port: 6444).
  # Example: [6444]
  extraEgressPorts: []

# -- Default SympoziumPolicies to install (permissive, restrictive, network-isolated)
defaultPolicies:
  # -- Install built-in policy presets
  enabled: true

# -- Default SkillPacks to install (code-review, incident-response, k8s-ops, sre-observability, llmfit, github-gitops, software-dev)
defaultSkills:
  enabled: true
  # -- List of SkillPack specs
  skills: []

# -- Default Ensembles to install (developer-team)
defaultPersonas:
  # -- Install built-in persona pack definitions (disabled by default, must be activated after install)
  enabled: true

# -- Maintained experimental AgentHarness examples. The chart registers the
# digest-pinned Pi and Hermes adapters and a policy that permits only those
# images. No Agent is created or changed: an operator must select the policy
# and runtime explicitly on an Agent before either adapter can execute.
harnessExamples:
  # -- Install the maintained persistent AgentRuntime catalog. One-shot
  # adapters remain available as explicit opt-in examples.
  enabled: true
  policy:
    # -- Policy an Agent must reference before it can execute either example.
    name: harness-examples
  pi:
    enabled: false
    name: pi-v0-84-4
    image: ghcr.io/sympozium-ai/harness-adapters/pi@sha256:b0d50402dc0a25b2c46f86dbd6b5de963487fa0ffa44058cb324ab2c68934f3b
  piSession:
    enabled: true
    name: pi-session-v0-84-4
    image: ghcr.io/sympozium-ai/harness-adapters/pi@sha256:8c8f0df071dc5307b3b557e0233a70757d8a4be17cb688c1ca725cb41001bbd5
  hermes:
    enabled: false
    name: hermes-v0-20-6
    image: ghcr.io/sympozium-ai/harness-adapters/hermes@sha256:df66d30c56e7a82c74b9df1d8ef4034127f017640f460c0d3aa7c15f28550ab4
  hermesSession:
    enabled: true
    name: hermes-session-v0-20-6
    image: ghcr.io/sympozium-ai/harness-adapters/hermes@sha256:70c643b287b4a74583c7fedafd60e853579a36380a652a3d39ab0ae8c86e2d3b

# -- Default MCPServer catalog entries to install (github, grafana, kubernetes, argocd, postgres)
defaultMcpServers:
  # -- Install built-in MCP server definitions (must be configured with credentials after install)
  enabled: true

# -- Pod security context (applied to all control plane pods)
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context (applied to all control plane containers)
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# -- OpenTelemetry Observability
observability:
  # -- Master switch. When false, all components init noop OTel (zero overhead).
  enabled: true
  # -- OTLP collector endpoint. Example: "http://otel-collector.monitoring.svc:4317"
  endpoint: "sympozium-otel-collector.sympozium-system.svc:4317"
  # -- OTLP transport: "grpc" (default, port 4317) or "http/protobuf" (port 4318)
  protocol: "grpc"
  # -- Static OTLP export headers (e.g., {"Authorization": "Bearer token"}).
  headers: {}
  # -- Secret reference for sensitive OTLP export headers.
  headersSecretRef: ""
  # -- Trace sampling probability: 0.0 (none) to 1.0 (all).
  samplingRatio: 1.0
  # -- Additional OTel resource attributes applied to ALL components.
  resourceAttributes: {}
  # -- Prefix for service names. Component name is appended.
  serviceNamePrefix: "sympozium"
  # -- Per-component tuning
  controller:
    batchTimeout: "5s"
  agentRunner:
    batchTimeout: "1s"
    shutdownTimeout: "10s"
  apiServer:
    batchTimeout: "5s"
  mcpBridge:
    batchTimeout: "1s"
  # -- Built-in OpenTelemetry collector
  collector:
    image:
      repository: otel/opentelemetry-collector
      tag: "0.104.0"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      otlpGrpcPort: 4317
      otlpHttpPort: 4318
      metricsPort: 8889
      healthPort: 13133
  # -- Default instance observability settings (used when creating new instances)
  defaultInstance:
    enabled: true
    otlpEndpoint: "sympozium-otel-collector.sympozium-system.svc:4317"
    otlpProtocol: "grpc"
    serviceName: "sympozium"
    resourceAttributes:
      deployment.environment: "cluster"
      k8s.cluster.name: "unknown"

# -- Envoy Gateway (shared, cluster-wide)
gateway:
  enabled: false                  # Opt-in: deploys GatewayClass + Gateway
  gatewayClassName: sympozium
  name: sympozium-gateway
  baseDomain: ""                  # e.g. "sympozium.example.com" → instances get <name>.sympozium.example.com
  tls:
    enabled: false
    certManagerClusterIssuer: ""  # e.g. "letsencrypt-prod"
    secretName: sympozium-wildcard-cert

# -- Web Proxy (per-instance, controller-managed)
webProxy:
  image:
    repository: ""                # defaults to <registry>/web-proxy
    tag: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# -- Node Probe DaemonSet (discovers inference providers on nodes)
nodeProbe:
  # -- Deploy the node-probe DaemonSet for discovering node-installed inference providers
  enabled: true
  # -- Label nodes that have /dev/kvm and a kernel under /boot with
  # celln.dev/kvm=true so the Celln fleet runs there without a manual label.
  # A label an operator set (either value) is never changed.
  labelKVMNodes: true
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/node-probe
    tag: ""
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi
  # -- Probe configuration
  config:
    probeInterval: 30s
    targets:
      - name: ollama
        port: 11434
        healthPath: /api/tags
        modelsPath: /api/tags
      - name: vllm
        port: 8000
        healthPath: /health
        modelsPath: /v1/models
      - name: llama-cpp
        port: 8080
        healthPath: /health
        modelsPath: /v1/models
      - name: lm-studio
        port: 1234
        healthPath: /v1/models
        modelsPath: /v1/models
  # -- Node selector to limit which nodes run the probe (default: all nodes)
  nodeSelector: {}
  # -- Tolerate all taints so probe runs on GPU and other tainted nodes
  tolerations:
    - operator: Exists
  affinity: {}

# -- llmfit DaemonSet (continuous per-node hardware fitness telemetry)
llmfit:
  daemonset:
    # -- Deploy the llmfit DaemonSet for continuous hardware fitness telemetry.
    # When enabled, the controller uses cached fitness data for instant model
    # placement instead of spawning probe pods.
    enabled: true
    image:
      repository: ""  # defaults to {{ .Values.image.registry }}/llmfit-daemon
      tag: ""
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    # -- Interval in seconds between fitness event publications
    eventInterval: 60
    # -- Node selector to limit which nodes run the daemon (default: all nodes)
    nodeSelector: {}
    # -- Tolerate all taints so daemon runs on GPU and other tainted nodes
    tolerations:
      - operator: Exists
    affinity: {}
  # -- Live eviction: re-place models when node fitness degrades
  liveEviction:
    enabled: false
    checkInterval: 30s
    degradeThreshold: 0.3
  # -- Pre-flight webhook: reject Model CRs that won't fit anywhere
  webhook:
    preflightValidation: false

# -- MCP Bridge (sidecar that connects agents to remote MCP tool servers)
mcpBridge:
  image:
    repository: ""  # defaults to {{ .Values.image.registry }}/mcp-bridge
    tag: ""
  resources:
    limits:
      cpu: 200m
      memory: 256Mi

# -- Kubernetes Agent Sandbox (kubernetes-sigs/agent-sandbox) integration.
# Enables an alternative execution backend using Sandbox CRDs for gVisor/Kata
# kernel-level isolation, warm pools for cold-start elimination, and
# suspend/resume lifecycle management.
# Requires: agent-sandbox CRDs installed in the cluster.
agentSandbox:
  # -- Enable Agent Sandbox CRD support. When false, all agent-sandbox features
  # are disabled and no RBAC rules for Sandbox CRs are created.
  enabled: false
  # -- Default runtimeClassName for Sandbox CRs ("gvisor", "kata", or "").
  # Used when no runtimeClass is specified on the AgentRun or policy.
  defaultRuntimeClass: "gvisor"
  # -- Create RBAC rules allowing the controller to manage Sandbox, SandboxClaim,
  # and SandboxWarmPool CRs (apiGroup: agents.x-k8s.io).
  rbac: true

# -- Celln hardware-isolated execution plane: the router and the per-node
# fleet (celln.fleet) that boots micro-VMs on every node labeled
# celln.dev/kvm=true. The fleet's two DaemonSets are privileged (they mount
# /dev/kvm, /boot, /lib/modules and a state directory); that is part of the
# security envelope an operator installs, stated by `sympozium install`.
# No node holds a model key: every Agent's model requests leave through the
# model gateway with that Agent's own key.
celln:
  enabled: false
  # -- Per-node native fleet. Label KVM nodes `celln.dev/kvm=true`: each node
  # prepares its own authority root from the operator-signed starter package
  # and runs a dispatcher; the router discovers them by DNS and binds every
  # parent to the owner that issued it. Replaces the single in-cluster
  # dispatcher and needs no per-node or per-namespace ceremony. See
  # docs/guides/celln-fleet-installation.md.
  fleet:
    enabled: false
    # -- Stable installation identity; node state lives at
    # /var/lib/sympozium-celln/<scope>. Never change it to renew consumed authority.
    scope: ""
    package:
      # -- OCI image (repository@sha256:digest) carrying the reviewed
      # `celln starter-package` output at /package.
      image: ""
      # -- blake3 hash of the package's package.json from `celln starter-inspect`.
      hash: ""
      # -- Optional Secret in celln-system with `.dockerconfigjson` for a private registry.
      pullSecret: ""
      # -- Skip registry TLS verification (development registries only). The
      # package is still verified against `hash` after download.
      insecureRegistry: false
    # -- Explicitly approved publisher key of the package (from `celln starter-inspect`).
    publisher: ""
    # -- Parent principal every owner authenticates; must match the
    # trusted-parent-clients policy and the model profile.
    principal: ""
    # -- ConfigMap in celln-system holding trusted-parent-clients.json (the
    # blake3 hash of router.parentTokenSecret's token, never the token).
    parentClientsConfigMap: ""
    # -- ConfigMap in celln-system the nodes publish the starter configuration to.
    configurationConfigMap: celln-fleet-configuration
    # -- ConfigMap in celln-system each node reports its Celln cells and parents to
    # (what `celln ps -a` shows), under data.<node>; the console reads it.
    cellsConfigMap: celln-fleet-cells
    # -- The fleet holds no model. Every node prepares one model-free starter
    # configuration from the reviewed package; each Agent brings its own
    # ModelConnection (any OpenAI- or Anthropic-compatible endpoint) and key,
    # which the model gateway adds to its requests. The 0.11 values
    # `backends`, `model`, `modelCredentialsSecret` and `backendsExtraRevision`
    # are refused if set.
    # -- Ceilings for one parent over its whole life; every node configures
    # them and the scope's policy admits runs within them. Zero keeps Celln's
    # reviewed defaults (1 h, 12 turns). The installer sets day-long defaults.
    # Every turn reserves 6 model requests and 6 x the connection's
    # maxOutputTokens output tokens; a model-free node is sized for the
    # largest cap (4096), so maxOutputTokens here must be at least 24576 and
    # may be up to 25165824 (1024 turns x 6 x 4096).
    limits:
      leaseSeconds: 0
      maxTurns: 0
      maxModelRequests: 0
      maxOutputTokens: 0
    # -- Hosts the https-fetch and https-post-json starter tools may reach.
    # Empty (or ["*"]) means any public HTTPS host; Celln's broker always
    # refuses private, loopback, link-local and reserved addresses. List
    # lowercase DNS names (at most 16) to restrict it. The installer's
    # --celln-fleet-https-host sets it.
    httpsHosts: []
    # -- Per-node budget. `auto` sizes each node when its dispatcher starts:
    # memoryBytes = memoryPercent of the node's memory (its cgroup limit when
    # set), maxCells = memoryBytes / cellMemoryBytes capped at maxCellsCeiling,
    # egressSlots = maxCells. A native parent charges two cells, two broker
    # slots and its declared memory (1.25 GiB for the starter), so a 64 GiB
    # node holds about 38 parents. `fixed` uses maxCells/memoryBytes/egressSlots
    # exactly. Celln releases before v0.5.12 hold one parent per node whatever
    # these say. A create the owner refuses for capacity ends
    # that run and it deletes cleanly.
    capacity: auto
    memoryPercent: 75
    cellMemoryBytes: 671088640
    maxCellsCeiling: 1024
    maxCells: 4
    memoryBytes: 4294967296
    # -- Exact hostnames a one-shot execution may name as direct egress from a
    # cell (celln `--allow-egress-host`). Model requests never use this: they
    # leave through the model gateway with the Agent's own key. Empty by default.
    allowEgressHosts: []
    # -- fixed mode only; defaults to maxCells (one broker slot per cell).
    egressSlots: 4
  # -- The model gateway: every native Celln Agent's model requests leave the
  # cell through it, and it adds that Agent's own provider key from the
  # Secret its ModelConnection names; no Celln node holds a key. Off in the
  # chart's own defaults; `sympozium install` turns it on for every fleet it
  # installs and bootstraps the key material itself (enabled, clusterId,
  # issuer.keyId and modelGateway.image are set on every run). Enabling it
  # wires the controller's scoped dispatch (CELLN_SCOPED_CONFIG), the fleet
  # dispatchers' scoped receiver and the gateway to the same issuer, keys,
  # tokens and CA. Requires celln.fleet and modelGateway.image. There is no
  # provider route list: an Agent's ModelConnection is its route; narrow it
  # with allowedOrigins/deniedOrigins on the scope's CellnExecutionPolicy.
  # See docs/guides/celln-mediated-model-access.md.
  mediation:
    enabled: false
    # -- Operator-chosen cluster identity bound into every signed decision.
    clusterId: ""
    # -- Namespace holding the controller's immutable prepared-operation
    # records; never a tenant namespace. Empty uses the control-plane namespace.
    preparationNamespace: ""
    issuer:
      # -- Fixed by the credential contract; the controller, dispatchers and
      # gateway all refuse another issuer.
      name: sympozium-control-plane
      # -- Key id of the signing key; must be a `kid` in the trust JWKS.
      keyId: ""
    # -- Control-plane Secret, controller only. Keys: issuer.key (one PKCS#8
    # Ed25519 PRIVATE KEY PEM), receiver-token, gateway-token.
    controllerSecret: celln-mediation-controller
    # -- Control-plane Secret, gateway only. Keys: tls.crt, tls.key,
    # registration-token (equal to the controller's gateway-token).
    gatewaySecret: celln-mediation-gateway
    # -- celln-system Secret. Keys: operator-token (equal to the controller's
    # receiver-token), tls.crt, tls.key (the receiver's TLS edge).
    nodeSecret: celln-mediation-node
    # -- Public ConfigMap of the same name in the control-plane namespace AND
    # celln-system. Keys: jwks.json (public Ed25519 JWKS), ca.crt (the CA that
    # signed both TLS certificates). Public material only, so a ConfigMap.
    trustConfigMap: celln-mediation-trust
    receiver:
      # -- HTTPS origin of the scoped receiver the controller uses. Empty uses
      # the chart's celln-scoped-receiver Service: the router's TLS edge,
      # which forwards each operation to the node that prepared it, on any
      # number of nodes. Set this only to reach it another way (its host name
      # must be in the receiver certificate).
      url: ""
      port: 9443
    # -- Parent request template for enduring scoped runs, read once when the
    # dispatcher starts. Empty uses scoped-parent-request.json in the first
    # backend's starter configuration on the node. When the file is absent the
    # dispatcher starts with one-shot scoped dispatch only.
    parentRequestFile: ""
  # -- One-command bootstrap for a fresh Celln install. Generates the
  # controller/router/backend/capability bearer Secrets and a router ownership
  # PVC, then the CLI points celln.tokenSecret, celln.capabilityTokenSecret and
  # celln.router.*Secret at them. Router backends (KVM node dispatcher
  # endpoints) and ownership storage class remain operator inputs.
  bootstrap:
    enabled: false
    clientTokenSecret: celln-router-client
    backendTokenSecret: celln-dispatcher-backend
    capabilityTokenSecret: celln-discovery
    ownershipClaim: celln-router-ownership
    ownershipStorageClass: ""
    ownershipStorage: 1Gi
  # -- URL of the celln-router Service. The API server reads fleet capabilities
  # and cells here; the controller reaches the fleet only through the scoped
  # receiver (celln.mediation).
  routerUrl: "http://celln-router.celln-system.svc.cluster.local:8787"
  # -- Existing Secret in the controller namespace, key `token`, holding the
  # router CLIENT bearer credential (at least 24 bytes) the router is configured
  # with. No token is generated or inferred from model credentials.
  tokenSecret: ""
  # -- Optional public ConfigMap with ca-bundle.crt containing the complete
  # system CA bundle plus the operator router CA. Mounted without subPath.
  caConfigMap: ""
  # -- Read-only discovery token Secret in the API-server namespace (key token).
  # Must differ from execution credentials and match router.capabilityTokenSecret.
  capabilityTokenSecret: ""
  # -- Explicitly permit a plaintext non-loopback router URL. Prefer an HTTPS
  # endpoint; cluster networking alone does not encrypt the bearer credential.
  allowInsecureHttp: false
  image:
    # The fleet node image: the celln binary + runtime assets. Built in this
    # repository (images/celln-installer); the celln repo does not publish it.
    # Tag defaults to .Chart.AppVersion.
    repository: "ghcr.io/sympozium-ai/sympozium/celln-installer"
    tag: ""
  router:
    # Parent principal used only behind the gateway; controller uses tokenSecret.
    parentTokenSecret: ""
    # -- Use an independently managed router/TLS endpoint. The chart configures
    # clients only and creates no router/installer/ownership resources.
    external: false
    replicas: 2
    # -- Complete, identical backend list on every replica; no Service that
    # load-balances different dispatcher owners. Current router supports HTTP only.
    backends: []
    # -- Explicit acknowledgement for plaintext router-to-dispatcher traffic.
    # Use only a trusted/encrypted network path; this is NOT a TLS setting.
    allowInsecureBackends: false
    # -- Existing Secrets in celln-system, each with key `token`. Client token
    # must match celln.tokenSecret's contents and differ from the backend token.
    clientTokenSecret: ""
    backendTokenSecret: ""
    # -- Read-only discovery Secret in celln-system; requires Celln PR #80 or later.
    capabilityTokenSecret: ""
    # -- Existing shared PVC in celln-system. Must provide coherent cross-node
    # POSIX flock, atomic publication and directory fsync, not just an RWX label.
    ownershipClaim: ""
    image:
      repository: "ghcr.io/sympozium-ai/celln"
      # -- Prefer a digest for a pinned router. `tag` is a fallback for the
      # bootstrap path and is less tamper-resistant.
      digest: ""
      tag: ""

# -- Persona delegation behavior.
delegation:
  # -- Opt-in controller-side delegation executor. When true, the controller
  # follows ensemble "delegation" relationship edges after a run succeeds and
  # spawns the target persona's run directly — a fallback for models that never
  # emit the delegate_to_persona tool call. Default false: the tool-driven
  # delegation path remains authoritative and behavior is unchanged when off.
  controllerExecutor: false

# -- Cluster-local inference models.
# Each item creates a Model CR that the controller reconciles into
# PVC + Deployment + Service. Supports llama-cpp (GGUF), vLLM, TGI, or custom servers.
models:
  enabled: false
  items: []
  # -- llama-server example (GGUF, default serverType):
  # items:
  #   - name: llama-3.1-8b-q4
  #     url: "https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
  #     filename: "model.gguf"
  #     storageSize: "10Gi"
  #     gpu: 1
  #     memory: "16Gi"
  #     cpu: "4"
  #     contextSize: 4096
  #     args: []
  #
  # -- vLLM example (HuggingFace model, GPU required):
  #   - name: llama-3.1-8b-vllm
  #     serverType: vllm
  #     modelID: "meta-llama/Llama-3.1-8B-Instruct"
  #     storageSize: "50Gi"
  #     gpu: 1
  #     memory: "24Gi"
  #     cpu: "4"
  #     contextSize: 8192
  #     huggingFaceTokenSecret: "hf-token"
  #     args: ["--dtype", "auto"]
  #
  # -- TGI example (HuggingFace Text Generation Inference):
  #   - name: mistral-7b-tgi
  #     serverType: tgi
  #     modelID: "mistralai/Mistral-7B-Instruct-v0.3"
  #     storageSize: "30Gi"
  #     gpu: 1
  #     memory: "20Gi"
  #     cpu: "4"
  #     contextSize: 8192
  #     huggingFaceTokenSecret: "hf-token"

# -- ServiceMonitor for Prometheus (requires prometheus-operator)
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Bundled llmfit-dra (claim-based model placement — non-optional by default).
# Disable ONLY on clusters below Kubernetes 1.34, where DRA is unavailable.
llmfit-dra:
  enabled: true
