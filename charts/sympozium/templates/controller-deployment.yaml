{{- $enduring := and .Values.celln.enabled .Values.celln.dispatcher.enduring.enabled }}
{{- $parent := .Values.celln.dispatcher.enduring }}
{{- $fleet := .Values.celln.fleet | default dict }}
{{- $fleetParents := and .Values.celln.enabled $fleet.enabled ($fleet.parentConfigSecret | default "") }}
{{- $mediated := include "sympozium.cellnMediation" . }}
{{- $mediation := .Values.celln.mediation | default dict }}
{{- if and .Values.controller.watchNamespace .Values.controller.excludeWatchNamespaces }}
{{- fail "choose either controller.watchNamespace or controller.excludeWatchNamespaces" }}
{{- end }}
{{- if and $fleetParents (ne (int .Values.controller.replicas) 1) }}
{{- fail "celln.fleet.parentConfigSecret requires one controller replica sharing one journal claim" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sympozium-controller-manager
  namespace: {{ include "sympozium.namespace" . }}
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    control-plane: controller-manager
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: sympozium-controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
        {{- if $enduring }}
        runAsUser: {{ $parent.uid }}
        runAsGroup: {{ $parent.gid }}
        {{- end }}
      {{- if $fleetParents }}
      # The manager refuses to create its journal/approval directories, so a
      # root step prepares them on the claim for the non-root manager.
      {{- end }}
      {{- if or $fleetParents $mediated }}
      initContainers:
      {{- end }}
      {{- if $fleetParents }}
        - name: prepare-parent-journal
          image: {{ printf "%s:%s" (.Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer") (.Values.celln.image.tag | default .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/install", "-d", "-m", "0700", "-o", "65532", "-g", "65532", "/var/lib/sympozium/celln-parent/journal", "/var/lib/sympozium/celln-parent/approvals"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: celln-parent-journal
              mountPath: /var/lib/sympozium/celln-parent
      {{- end }}
      {{- if $mediated }}
        # The manager refuses a signing key or transport token that is not
        # owner-only, and a Secret volume cannot be owned by a non-root user.
        # This step copies the operator's files into memory as UID 65532, mode
        # 0400; it generates nothing. Only it mounts the Secret.
        - name: celln-scoped-private-files
          image: {{ printf "%s:%s" (.Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer") (.Values.celln.image.tag | default .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              for file in issuer.key receiver-token gateway-token; do
                [ -s "/operator/$file" ] || { echo "Secret key $file is missing or empty; run sympozium celln-mediation bootstrap" >&2; exit 1; }
                rm -f "/private/$file"
                install -m 0400 "/operator/$file" "/private/$file"
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: celln-scoped-operator
              mountPath: /operator
              readOnly: true
            - name: celln-scoped-private
              mountPath: /private
      {{- end }}
      containers:
        - name: manager
          image: {{ include "sympozium.controllerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.controller.excludeWatchNamespaces }}
            - --exclude-watch-namespaces={{ join "," .Values.controller.excludeWatchNamespaces }}
            {{- end }}
            {{- if .Values.controller.watchNamespace }}
            - --watch-namespace={{ .Values.controller.watchNamespace }}
            {{- end }}
            {{- if .Values.controller.leaderElect }}
            - --leader-elect
            {{- end }}
          env:
            - name: NATS_URL
              value: {{ include "sympozium.natsUrl" . }}
            {{- if and .Values.nats.enabled .Values.nats.auth.enabled }}
            - name: NATS_USERNAME
              value: sympozium-control
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sympozium.natsAuthSecret" . }}
                  key: control-password
            - name: NATS_BRIDGE_USERNAME
              value: sympozium-bridge
            - name: NATS_BRIDGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sympozium.natsAuthSecret" . }}
                  key: bridge-password
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Image registry/tag used by the controller when spawning
            # runtime pods (agent-runner, ipc-bridge, channel-*, skill sidecars,
            # mcp-bridge, llmfit probe, web-proxy, memory server, …).
            # Allows fully self-hosting all Sympozium-built images.
            - name: SYMPOZIUM_IMAGE_REGISTRY
              value: {{ .Values.image.registry | quote }}
            {{- $imgTag := .Values.image.tag | default .Chart.AppVersion }}
            {{- if $imgTag }}
            - name: SYMPOZIUM_IMAGE_TAG
              value: {{ $imgTag | quote }}
            {{- end }}
            {{- if .Values.delegation.controllerExecutor }}
            # Opt-in fallback: spawn delegation-edge targets controller-side for
            # models that never emit the delegate_to_persona tool. Default off;
            # the tool-driven delegation path is unchanged when unset.
            - name: SYMPOZIUM_DELEGATION_CONTROLLER_EXECUTOR
              value: "true"
            {{- end }}
            {{- if .Values.observability.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: "{{ .Values.observability.serviceNamePrefix }}-controller"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.observability.samplingRatio | quote }}
            - name: SYMPOZIUM_OTEL_BATCH_TIMEOUT
              value: {{ .Values.observability.controller.batchTimeout | quote }}
            {{- if .Values.observability.headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ include "sympozium.otelHeaders" . | quote }}
            {{- end }}
            {{- if .Values.observability.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "sympozium.otelResourceAttrs" . | quote }}
            {{- end }}
            # Default observability config for Ensemble-created instances.
            - name: SYMPOZIUM_DEFAULT_OTEL_ENABLED
              value: {{ .Values.observability.defaultInstance.enabled | quote }}
            - name: SYMPOZIUM_DEFAULT_OTEL_ENDPOINT
              value: {{ .Values.observability.defaultInstance.otlpEndpoint | quote }}
            - name: SYMPOZIUM_DEFAULT_OTEL_PROTOCOL
              value: {{ .Values.observability.defaultInstance.otlpProtocol | quote }}
            - name: SYMPOZIUM_DEFAULT_OTEL_SERVICE_NAME
              value: {{ .Values.observability.defaultInstance.serviceName | quote }}
            {{- end }}
            {{- if .Values.agentSandbox.enabled }}
            - name: AGENT_SANDBOX_ENABLED
              value: "true"
            - name: AGENT_SANDBOX_DEFAULT_RUNTIME_CLASS
              value: {{ .Values.agentSandbox.defaultRuntimeClass | quote }}
            {{- end }}
            {{- if .Values.memory.adminDelete.enabled }}
            # Names the Secret holding the memory-server admin-delete bearer token.
            # The controller injects it (optional SecretKeyRef) into every
            # memory-server pod it creates, enabling the admin-only DELETE /delete.
            - name: MEMORY_ADMIN_TOKEN_SECRET
              value: {{ printf "%s-memory-admin-token" (include "sympozium.fullname" .) | quote }}
            {{- end }}
            {{- if .Values.celln.enabled }}
            - name: CELLN_ROUTER_URL
              value: {{ .Values.celln.routerUrl | quote }}
            - name: CELLN_ALLOW_INSECURE_HTTP
              value: {{ .Values.celln.allowInsecureHttp | quote }}
            {{- if .Values.celln.caConfigMap }}
            - name: SSL_CERT_FILE
              value: /etc/sympozium/celln-router-ca/ca-bundle.crt
            {{- end }}
            - name: CELLN_HARNESS_ENABLED
              value: {{ .Values.celln.harnessEnabled | default false | quote }}
            {{- if .Values.celln.catalogueConfigSecret }}
            - name: CELLN_CATALOGUE_CONFIG
              value: /etc/sympozium/celln-catalogue/config.json
            {{- end }}
            {{- if .Values.celln.tokenSecret }}
            - name: CELLN_TOKEN_FILE
              value: /etc/sympozium/celln/token
            {{- end }}
            {{- if and .Values.celln.dispatcher .Values.celln.dispatcher.enduring .Values.celln.dispatcher.enduring.enabled .Values.celln.dispatcher.enduring.parentConfigSecret }}
            # Enduring parent lifecycle on the same in-cluster dispatcher: the
            # main controller reconciles parents directly against the dispatcher
            # Service — no separate celln-parent-controller Deployment.
            - name: CELLN_PARENT_CONFIG
              value: {{ printf "%s/approvals" $parent.statePath | quote }}
            - name: CELLN_PARENT_REGISTRATIONS
              value: /etc/sympozium/celln-parent/registrations.json
            {{- end }}
            {{- if $mediated }}
            # Mediated model access: scoped dispatch to the fleet's receiver
            # and registration with the model gateway (celln.mediation).
            - name: CELLN_SCOPED_CONFIG
              value: /etc/sympozium/celln-scoped/config.json
            {{- end }}
            {{- if $fleetParents }}
            # Fleet parents are issued by their gateway-bound owner; the
            # controller keeps only its own journal/approvals on a claim.
            - name: CELLN_PARENT_CONFIG
              value: /var/lib/sympozium/celln-parent/approvals
            - name: CELLN_PARENT_REGISTRATIONS
              value: /etc/sympozium/celln-parent/registrations.json
            {{- end }}
            {{- end }}
            {{- if .Values.pricing.enabled }}
            - name: SYMPOZIUM_PRICING_CONFIGMAP
              value: "sympozium-model-pricing"
            - name: SYMPOZIUM_PRICING_NAMESPACE
              value: {{ include "sympozium.namespace" . | quote }}
            {{- end }}
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if and .Values.celln.enabled (or .Values.celln.tokenSecret .Values.celln.catalogueConfigSecret .Values.celln.caConfigMap $fleetParents $mediated (and .Values.celln.dispatcher .Values.celln.dispatcher.enduring .Values.celln.dispatcher.enduring.enabled .Values.celln.dispatcher.enduring.parentConfigSecret)) }}
          volumeMounts:
            {{- if .Values.celln.caConfigMap }}
            - name: celln-router-ca
              mountPath: /etc/sympozium/celln-router-ca
              readOnly: true
            {{- end }}
            {{- if .Values.celln.tokenSecret }}
            - name: celln-token
              mountPath: /etc/sympozium/celln
              readOnly: true
            {{- end }}
            {{- if .Values.celln.catalogueConfigSecret }}
            - name: celln-catalogue-config
              mountPath: /etc/sympozium/celln-catalogue
              readOnly: true
            {{- end }}
            {{- if and .Values.celln.dispatcher .Values.celln.dispatcher.enduring .Values.celln.dispatcher.enduring.enabled .Values.celln.dispatcher.enduring.parentConfigSecret }}
            - name: celln-parent-state
              mountPath: {{ $parent.statePath | quote }}
            - name: celln-parent-config
              mountPath: /etc/sympozium/celln-parent
              readOnly: true
            {{- end }}
            {{- if $fleetParents }}
            - name: celln-parent-journal
              mountPath: /var/lib/sympozium/celln-parent
            - name: celln-parent-config
              mountPath: /etc/sympozium/celln-parent
              readOnly: true
            {{- end }}
            {{- if $mediated }}
            - name: celln-scoped-config
              mountPath: /etc/sympozium/celln-scoped
              readOnly: true
            - name: celln-scoped-trust
              mountPath: /etc/sympozium/celln-scoped-trust
              readOnly: true
            - name: celln-scoped-private
              mountPath: /run/sympozium/celln-scoped
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if and .Values.celln.enabled (or .Values.celln.tokenSecret .Values.celln.catalogueConfigSecret .Values.celln.caConfigMap $fleetParents $mediated (and .Values.celln.dispatcher .Values.celln.dispatcher.enduring .Values.celln.dispatcher.enduring.enabled .Values.celln.dispatcher.enduring.parentConfigSecret)) }}
      volumes:
        {{- if .Values.celln.caConfigMap }}
        - name: celln-router-ca
          configMap:
            name: {{ .Values.celln.caConfigMap | quote }}
        {{- end }}
        {{- if .Values.celln.tokenSecret }}
        - name: celln-token
          secret:
            secretName: {{ .Values.celln.tokenSecret | quote }}
            items:
              - key: token
                path: token
        {{- end }}
        {{- if .Values.celln.catalogueConfigSecret }}
        - name: celln-catalogue-config
          secret:
            secretName: {{ .Values.celln.catalogueConfigSecret | quote }}
        {{- end }}
        {{- if and .Values.celln.dispatcher .Values.celln.dispatcher.enduring .Values.celln.dispatcher.enduring.enabled .Values.celln.dispatcher.enduring.parentConfigSecret }}
        - name: celln-parent-state
          hostPath:
            path: {{ $parent.statePath | quote }}
            type: Directory
        - name: celln-parent-config
          secret:
            secretName: {{ .Values.celln.dispatcher.enduring.parentConfigSecret | quote }}
        {{- end }}
        {{- if $fleetParents }}
        - name: celln-parent-journal
          persistentVolumeClaim:
            claimName: {{ ($fleet.journal | default dict).claim | default "celln-parent-journal" | quote }}
        - name: celln-parent-config
          secret:
            secretName: {{ $fleet.parentConfigSecret | quote }}
        {{- end }}
        {{- if $mediated }}
        - name: celln-scoped-config
          configMap:
            name: sympozium-celln-scoped-config
        - name: celln-scoped-trust
          configMap:
            name: {{ $mediation.trustConfigMap | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        # World-readable inside this volume only so UID 65532 can copy it; the
        # manager container never mounts it.
        - name: celln-scoped-operator
          secret:
            secretName: {{ $mediation.controllerSecret | quote }}
            defaultMode: 0444
            items:
              - key: issuer.key
                path: issuer.key
              - key: receiver-token
                path: receiver-token
              - key: gateway-token
                path: gateway-token
        - name: celln-scoped-private
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
      {{- end }}
      {{- if $enduring }}
      nodeSelector:
        {{- with omit .Values.controller.nodeSelector "kubernetes.io/hostname" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        kubernetes.io/hostname: {{ $parent.nodeName | quote }}
      {{- else }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
