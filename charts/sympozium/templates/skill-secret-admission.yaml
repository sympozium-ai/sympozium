{{- /* Skill sidecars run as their AgentRun's ServiceAccount. Without Secret
     access in RBAC, a skill that may create workloads could still reach a
     model key by creating a pod that mounts the Secret. This admission policy
     refuses that for every restricted run account (sympozium-run-*); runs
     whose SympoziumPolicy sets skillPolicy.allowSecretAccess use the
     sympozium-trusted-run- prefix instead. */}}
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "sympozium.fullname" . }}-skill-secret-references
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: restricted-run-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        size(request.userInfo.username.split(':')) == 4 &&
        request.userInfo.username.split(':')[3].startsWith('sympozium-run-')
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        (has(variables.podSpec.containers) ? variables.podSpec.containers : []) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
  validations:
    - expression: >-
        !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
          !has(v.secret) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret))))
      message: "an agent run's skill may not create workloads that mount Secrets (model keys); allow it with SympoziumPolicy spec.skillPolicy.allowSecretAccess"
    - expression: >-
        variables.containers.all(c,
          (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) &&
          (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))
      message: "an agent run's skill may not create workloads that read Secrets (model keys) into the environment; allow it with SympoziumPolicy spec.skillPolicy.allowSecretAccess"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "sympozium.fullname" . }}-skill-secret-references
  labels:
    {{- include "sympozium.labels" . | nindent 4 }}
spec:
  policyName: {{ include "sympozium.fullname" . }}-skill-secret-references
  validationActions: [Deny]
{{- end }}
