{{- if .Values.celln.enabled }}
{{- $bootstrap := .Values.celln.bootstrap | default dict }}
{{- $clientSecret := $bootstrap.clientTokenSecret | default "celln-router-client" }}
{{- $backendSecret := $bootstrap.backendTokenSecret | default "celln-dispatcher-backend" }}
{{- $capabilitySecret := $bootstrap.capabilityTokenSecret | default "celln-discovery" }}
{{- $ownershipClaim := $bootstrap.ownershipClaim | default "celln-router-ownership" }}
{{- $routerImage := "" }}
{{- if not .Values.celln.router.external }}
{{- if .Values.celln.router.image.digest }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.celln.router.image.digest) }}
{{- fail "celln.router.image.digest must be a sha256 digest when set" }}
{{- end }}
{{- $routerImage = printf "%s@%s" .Values.celln.router.image.repository .Values.celln.router.image.digest }}
{{- else if .Values.celln.router.image.tag }}
{{- $routerImage = printf "%s:%s" .Values.celln.router.image.repository .Values.celln.router.image.tag }}
{{- else }}
{{- fail "celln.router.image.digest (recommended) or celln.router.image.tag is required" }}
{{- end }}
{{- end }}
{{- $dispatcher := .Values.celln.dispatcher | default dict }}
{{- $dispatcherImage := $dispatcher.image | default dict }}
{{- $dispatcherRepo := $dispatcherImage.repository | default .Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer" }}
{{- $dispatcherTag := $dispatcherImage.tag | default .Values.celln.image.tag | default .Chart.AppVersion }}
{{- $clientToken := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $clientSecret }}{{ $clientToken = index .data "token" | b64dec }}{{ end }}
{{- $backendToken := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" "celln-system" $backendSecret }}{{ $backendToken = index .data "token" | b64dec }}{{ end }}
{{- $capabilityToken := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $capabilitySecret }}{{ $capabilityToken = index .data "token" | b64dec }}{{ end }}
{{- if and (not (hasPrefix "https://" .Values.celln.routerUrl)) (not .Values.celln.allowInsecureHttp) }}
{{- fail "Celln requires an HTTPS routerUrl or explicit celln.allowInsecureHttp acknowledgement" }}
{{- end }}
{{- if .Values.celln.router.external }}
{{- if or (not .Values.celln.tokenSecret) (not .Values.celln.capabilityTokenSecret) (eq .Values.celln.tokenSecret .Values.celln.capabilityTokenSecret) }}
{{- fail "external Celln router requires distinct execution and discovery token Secrets" }}
{{- end }}
{{- if .Values.celln.installer.enabled }}
{{- fail "external Celln router cannot enable the legacy host installer" }}
{{- end }}
{{- else }}
{{- if not .Values.celln.router.backends }}
{{- fail "celln.router.backends must contain the complete stable dispatcher endpoint list" }}
{{- end }}
{{- range .Values.celln.router.backends }}
{{- if not (regexMatch "^http://[^/,?#@[:space:]]+(:[0-9]+)?$" .) }}
{{- fail "celln.router.backends requires explicit HTTP origins (HTTPS is not supported by this router)" }}
{{- end }}
{{- end }}
{{- if not .Values.celln.router.allowInsecureBackends }}
{{- fail "celln.router.allowInsecureBackends must explicitly acknowledge the plaintext backend transport" }}
{{- end }}
{{- if or (not .Values.celln.router.clientTokenSecret) (not .Values.celln.router.backendTokenSecret) (not .Values.celln.tokenSecret) }}
{{- fail "Celln requires controller, router client, and router backend token Secret references" }}
{{- end }}
{{- if eq .Values.celln.router.clientTokenSecret .Values.celln.router.backendTokenSecret }}
{{- fail "Celln client and backend credentials must use distinct Secrets" }}
{{- end }}
{{- if not .Values.celln.router.ownershipClaim }}
{{- fail "celln.router.ownershipClaim must reference durable shared POSIX storage" }}
{{- end }}
{{- if or (not .Values.celln.capabilityTokenSecret) (not .Values.celln.router.capabilityTokenSecret) }}
{{- fail "Celln requires API-server and router read-only capability token Secret references" }}
{{- end }}
{{- if or (eq .Values.celln.capabilityTokenSecret .Values.celln.tokenSecret) (eq .Values.celln.router.capabilityTokenSecret .Values.celln.router.clientTokenSecret) (eq .Values.celln.router.capabilityTokenSecret .Values.celln.router.backendTokenSecret) }}
{{- fail "Celln capability credentials must use distinct Secrets from execution credentials" }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
{{- if $bootstrap.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $clientToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecret }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $clientToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $backendSecret }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $backendToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $capabilitySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $capabilityToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $capabilitySecret }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  token: {{ $capabilityToken | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $ownershipClaim }}
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
spec:
  accessModes:
  - {{ $bootstrap.ownershipAccessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ $bootstrap.ownershipStorage | default "1Gi" }}
  {{- with $bootstrap.ownershipStorageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.celln.installer.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: celln-agent-key
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
type: Opaque
stringData:
  {{- if .Values.celln.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.celln.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.celln.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.celln.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.celln.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ .Values.celln.deepseekApiKey | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-installer
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-installer
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-installer
    spec:
      hostPID: true
      containers:
      - name: installer
        image: {{ .Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer" }}:{{ .Values.celln.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: DEEPSEEK_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: OPENAI_API_KEY
              optional: true
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: celln-agent-key
              key: OPENAI_BASE_URL
              optional: true
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: host-run
          mountPath: /run/systemd
        - name: kvm
          mountPath: /dev/kvm
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: host-run
        hostPath:
          path: /run
          type: Directory
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
{{- end }}
{{- if $dispatcher.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celln-dispatcher
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-dispatcher
    app.kubernetes.io/part-of: sympozium
spec:
  replicas: {{ $dispatcher.replicas | default 1 }}
  # The dispatcher takes an exclusive flock on its hostPath state root
  # (/var/lib/celln). RollingUpdate would overlap the outgoing and incoming
  # pods and they would contend for the lock, so the old pod must be fully
  # terminated before a replacement starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-dispatcher
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        celln.dev/kvm: "true"
      containers:
      - name: dispatcher
        image: {{ printf "%s:%s" $dispatcherRepo $dispatcherTag | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/celln"]
        args:
        - dispatcher
        - --listen
        - 0.0.0.0:8787
        - --unsafe-non-loopback
        - --token-file
        - /etc/celln/backend/token
        - --root
        - /var/lib/celln
        - --mote-store
        - /var/lib/celln/motes
        - --tool-store
        - /var/lib/celln/tools
        - --node-name
        - $(NODE_NAME)
        {{- range $dispatcher.allowEgressHosts | default (list "api.deepseek.com") }}
        - --allow-egress-host
        - {{ . | quote }}
        {{- end }}
        - --egress-slots
        - {{ $dispatcher.egressSlots | default 1 | quote }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: backend
          mountPath: /etc/celln/backend
          readOnly: true
        - name: state
          mountPath: /var/lib/celln
        - name: kvm
          mountPath: /dev/kvm
        - name: boot
          mountPath: /boot
          readOnly: true
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: backend
        secret:
          secretName: {{ $backendSecret }}
          defaultMode: 0440
      - name: state
        hostPath:
          path: {{ $dispatcher.statePath | default "/var/lib/celln" }}
          type: Directory
      - name: kvm
        hostPath:
          path: /dev/kvm
          type: CharDevice
      - name: boot
        hostPath:
          path: /boot
          type: Directory
      - name: modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: celln-dispatcher
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-dispatcher
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    app.kubernetes.io/name: celln-dispatcher
  ports:
  - name: http
    port: 8787
    targetPort: 8787
    protocol: TCP
{{- end }}
{{- if not .Values.celln.router.external }}
---
# Every replica sees the same backend identities and durable owner ledger.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  replicas: {{ .Values.celln.router.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: router
        image: {{ $routerImage | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/celln"]
        args:
        - route
        - --listen
        - 0.0.0.0:8788
        - --backends
        - {{ join "," .Values.celln.router.backends | quote }}
        - --token-file
        - /etc/celln/backend/token
        - --client-token-file
        - /etc/celln/client/token
        - --capability-token-file
        - /etc/celln/capability/token
        - --ownership-dir
        - /var/lib/celln/ownership
        - --mode
        - round-robin
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 8788
          protocol: TCP
        volumeMounts:
        - name: client-token
          mountPath: /etc/celln/client
          readOnly: true
        - name: backend-token
          mountPath: /etc/celln/backend
          readOnly: true
        - name: ownership
          mountPath: /var/lib/celln/ownership
        - name: capability-token
          mountPath: /etc/celln/capability
          readOnly: true
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "200m"
      volumes:
      - name: client-token
        secret:
          secretName: {{ .Values.celln.router.clientTokenSecret | quote }}
          defaultMode: 0440
      - name: backend-token
        secret:
          secretName: {{ .Values.celln.router.backendTokenSecret | quote }}
          defaultMode: 0440
      - name: ownership
        persistentVolumeClaim:
          claimName: {{ .Values.celln.router.ownershipClaim | quote }}
      - name: capability-token
        secret:
          secretName: {{ .Values.celln.router.capabilityTokenSecret | quote }}
          defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: celln-router
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-router
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    app.kubernetes.io/name: celln-router
  ports:
  - name: http
    port: 8787
    targetPort: 8788
    protocol: TCP
{{- end }}
{{- end }}
{{- end }}
