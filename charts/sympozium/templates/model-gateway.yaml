{{- /* celln.mediation deploys this gateway too, from Secret/ConfigMap volumes
     instead of the configuration claim; see _helpers.tpl for its checks. */}}
{{- $mediated := include "sympozium.cellnMediation" . }}
{{- if or .Values.modelGateway.enabled $mediated }}
{{- $image := required "modelGateway.image requires an immutable image digest" .Values.modelGateway.image }}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" $image) }}
{{- fail "modelGateway.image must be pinned by sha256 digest" }}
{{- end }}
{{- $claim := "" }}
{{- if not $mediated }}
{{- $claim = required "modelGateway.configurationClaim must contain reviewed TLS/JWKS/PostgreSQL configuration" .Values.modelGateway.configurationClaim }}
{{- end }}
{{- $name := printf "%s-model-gateway" (include "sympozium.fullname" .) }}
{{- $m := .Values.celln.mediation | default dict }}
{{- $database := .Values.modelGateway.database | default dict }}
{{- $bundledDatabase := include "sympozium.modelGatewayBundledDatabase" . }}
{{- $databaseSecret := $database.secretName }}
{{- $databaseKey := $database.key }}
{{- if $bundledDatabase }}
{{- $databaseSecret = include "sympozium.modelGatewayDatabaseName" . }}
{{- $databaseKey = "database-url" }}
{{- end }}
{{- $tenantNamespaces := .Values.modelGateway.namespaces | default list }}
{{- $seenNamespaces := dict }}
{{- range $ns := $tenantNamespaces }}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$" ($ns | toString))) (hasKey $seenNamespaces ($ns | toString)) }}
{{- fail (printf "modelGateway.namespaces must be unique namespace names: %q" ($ns | toString)) }}
{{- end }}
{{- $_ := set $seenNamespaces ($ns | toString) true }}
{{- end }}
{{- $gatewayConfig := dict }}
{{- if $mediated }}
{{- $gatewayConfig = dict "clusterId" $m.clusterId "issuer" $m.issuer.name "listen" ":8443" "tlsCertificateFile" "/run/model-gateway/private/tls.crt" "tlsKeyFile" "/run/model-gateway/private/tls.key" "verificationKeysFile" "/etc/model-gateway/trust/jwks.json" "registrationTokenFile" "/run/model-gateway/private/registration-token" "databaseUrlFile" "/run/model-gateway/private/database-url" "privateOrigins" (.Values.modelGateway.privateOrigins | default list) }}
{{- if $tenantNamespaces }}
{{- $_ := set $gatewayConfig "readinessNamespaces" $tenantNamespaces }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "sympozium.namespace" . }}
{{- if $tenantNamespaces }}
---
# Least privilege: cluster scope keeps only the named Namespace reads and the
# gateway's own access reviews; Secrets and ModelConnections are readable in
# the listed tenant namespaces alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: {{ toJson $tenantNamespaces }}
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
{{- range $ns := $tenantNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [sympozium.ai]
    resources: [modelconnections]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "sympozium.namespace" $ }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  # Application UID/reference checks do NOT narrow this cluster-wide get power.
  - apiGroups: [""]
    resources: [namespaces, secrets]
    verbs: [get]
  - apiGroups: [sympozium.ai]
    resources: [modelconnections]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "sympozium.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "sympozium.namespace" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      {{- if $mediated }}
      annotations:
        checksum/configuration: {{ toJson $gatewayConfig | sha256sum | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if $mediated }}
      # The gateway refuses a token or database file that is not owner-only,
      # and a Secret volume cannot be owned by a non-root user. This step
      # copies the operator's files into memory as UID 65532, mode 0400; it
      # creates, fetches and changes nothing. Only it mounts the Secrets.
      initContainers:
        - name: private-files
          image: {{ printf "%s:%s" (.Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer") (.Values.celln.image.tag | default .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              for file in tls.crt tls.key registration-token database-url; do
                [ -s "/operator/$file" ] || { echo "operator Secret key for $file is missing or empty" >&2; exit 1; }
                rm -f "/private/$file"
                install -m 0400 "/operator/$file" "/private/$file"
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: operator
              mountPath: /operator
              readOnly: true
            - name: private
              mountPath: /private
        {{- if $bundledDatabase }}
        # The chart's own database: wait for it, then apply the gateway's
        # migrations (idempotent) before the gateway checks its schema.
        - name: migrate
          image: {{ .Values.modelGateway.database.bundled.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -ec
            - |
              url="$(cat /private/database-url)"
              tries=0
              until pg_isready -q -d "$url"; do
                tries=$((tries + 1))
                [ "$tries" -lt 60 ] || { echo "the bundled PostgreSQL did not become ready in 5 minutes" >&2; exit 1; }
                sleep 5
              done
              for file in /migrations/*.sql; do
                psql -q -v ON_ERROR_STOP=1 -d "$url" -f "$file"
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: private
              mountPath: /private
              readOnly: true
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: migrate-tmp
              mountPath: /tmp
        {{- end }}
      {{- end }}
      containers:
        - name: model-gateway
          image: {{ $image | quote }}
          {{- if $mediated }}
          args: ["--config=/etc/model-gateway/configuration/gateway.json"]
          {{- else }}
          args: ["--config=/configuration/gateway.json"]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              port: https
              path: /readyz
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            {{- if $mediated }}
            - name: configuration
              mountPath: /etc/model-gateway/configuration
              readOnly: true
            - name: trust
              mountPath: /etc/model-gateway/trust
              readOnly: true
            - name: private
              mountPath: /run/model-gateway/private
              readOnly: true
            {{- else }}
            - name: configuration
              mountPath: /configuration
              readOnly: true
            {{- end }}
      volumes:
        {{- if $mediated }}
        - name: configuration
          configMap:
            name: {{ printf "%s-configuration" $name | quote }}
        # Public JWKS; mounted without subPath so a rotated keyset arrives and
        # an explicit SIGHUP reloads it.
        - name: trust
          configMap:
            name: {{ $m.trustConfigMap | quote }}
            items:
              - key: jwks.json
                path: jwks.json
        # World-readable inside this volume only so UID 65532 can copy it; the
        # gateway container never mounts it.
        - name: operator
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ $m.gatewaySecret | quote }}
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
                    - key: registration-token
                      path: registration-token
              - secret:
                  name: {{ $databaseSecret | quote }}
                  items:
                    - key: {{ $databaseKey | quote }}
                      path: database-url
        - name: private
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if $bundledDatabase }}
        - name: migrations
          configMap:
            name: {{ printf "%s-migrations" $name | quote }}
        - name: migrate-tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- end }}
        {{- else }}
        - name: configuration
          persistentVolumeClaim:
            claimName: {{ $claim | quote }}
            readOnly: true
        {{- end }}
{{- if $bundledDatabase }}
---
# The gateway's schema, applied by the migrate init container. Synced from
# migrations/ by `make helm-sync`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-migrations" $name | quote }}
  namespace: {{ include "sympozium.namespace" . }}
data:
{{- range $path, $_ := .Files.Glob "files/model-gateway-migrations/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
{{- if $mediated }}
---
# Paths only; every credential stays in the operator's Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-configuration" $name | quote }}
  namespace: {{ include "sympozium.namespace" . }}
data:
  gateway.json: {{ toJson $gatewayConfig | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "sympozium.namespace" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ include "sympozium.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "sympozium.namespace" . | quote }}
          podSelector:
            matchLabels:
              control-plane: controller-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celln-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celln-dispatcher
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celln-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celln-router
        # The installed fleet runs its dispatcher inside the celln-node
        # DaemonSet pods (celln-fleet.yaml), which carry this label instead.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: celln-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: celln-node
      ports:
        - protocol: TCP
          port: 8443
  egress:
  {{- if .Values.modelGateway.egress }}
{{ toYaml .Values.modelGateway.egress | indent 4 }}
  {{- else }}
    # No list: any destination. Each call is still bound to the Agent's own
    # route and key, and private addresses still need gateway approval
    # (privateOrigins).
    - {}
  {{- end }}
    {{- if $bundledDatabase }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "sympozium.modelGatewayDatabaseName" . }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end }}
