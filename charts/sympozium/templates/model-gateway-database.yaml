{{- /* The model gateway's own PostgreSQL: rendered only with celln.mediation
     and no operator database Secret (modelGateway.database.secretName). */}}
{{- if include "sympozium.modelGatewayBundledDatabase" . }}
{{- $name := include "sympozium.modelGatewayDatabaseName" . }}
{{- $namespace := include "sympozium.namespace" . }}
{{- $bundled := .Values.modelGateway.database.bundled }}
{{- /* Generated once; an upgrade keeps the password the data directory was
       initialised with. */}}
{{- $password := randAlphaNum 32 }}
{{- $existing := lookup "v1" "Secret" $namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    # The PVC outlives an uninstall, so the password it was initialised with
    # must too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  database-url: {{ printf "postgres://gateway:%s@%s.%s.svc:5432/gateway?sslmode=disable" $password $name $namespace | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # The postgres user of the alpine image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $bundled.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
            # A subdirectory, so initdb owns it and the volume root's
            # lost+found does not count as existing data.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "gateway", "-d", "gateway"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "gateway", "-d", "gateway"]
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with $bundled.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: password
              mountPath: /run/secrets/postgres
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: password
          secret:
            secretName: {{ $name }}
            items:
              - key: password
                path: password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $bundled.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $bundled.storage | default "1Gi" | quote }}
---
# Only the model gateway reaches the database, and the database reaches
# nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ printf "%s-model-gateway" (include "sympozium.fullname" .) }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
