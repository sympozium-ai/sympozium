{{- $fleet := .Values.celln.fleet | default dict }}
{{- if and .Values.celln.enabled $fleet.enabled }}
{{- if or .Values.celln.dispatcher.enabled .Values.celln.installer.enabled .Values.celln.nativeParent.enabled .Values.celln.router.external }}
{{- fail "celln.fleet replaces the single in-cluster dispatcher and cannot combine with installer, nativeParent or an external router" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,62}$" ($fleet.scope | default "")) }}
{{- fail "celln.fleet.scope must be a stable DNS-label installation identity" }}
{{- end }}
{{- $package := $fleet.package | default dict }}
{{- if not (regexMatch "^[^@:[:space:]]+(:[0-9]+)?(/[^@[:space:]]+)?@sha256:[a-f0-9]{64}$" ($package.image | default "")) }}
{{- fail "celln.fleet.package.image must be a digest-pinned OCI reference (repository@sha256:...)" }}
{{- end }}
{{- if not (regexMatch "^blake3:[a-f0-9]{64}$" ($package.hash | default "")) }}
{{- fail "celln.fleet.package.hash must be the reviewed blake3 package hash" }}
{{- end }}
{{- if or (not $fleet.publisher) (not $fleet.principal) (not $fleet.parentClientsConfigMap) (not $fleet.configurationConfigMap) }}
{{- fail "celln.fleet requires publisher, principal, parentClientsConfigMap and configurationConfigMap" }}
{{- end }}
{{- if not .Values.celln.router.parentTokenSecret }}
{{- fail "celln.fleet requires router.parentTokenSecret for gateway parent routing" }}
{{- end }}
{{- /* Model backends: the celln.fleet.backends list, or the legacy single
     backend named native built from celln.fleet.model. Every node configures
     every backend; keys come from one Secret keyed by backend name, mounted
     once, so a backend added later needs no owner restart. */}}
{{- if ($fleet.modelCredential | default dict).secret }}
{{- fail "celln.fleet.modelCredential is replaced by celln.fleet.modelCredentialsSecret (one Secret keyed by backend name)" }}
{{- end }}
{{- $credentialsSecret := $fleet.modelCredentialsSecret | default "celln-fleet-model-credentials" }}
{{- $credentialsDir := "/etc/celln-native/credentials" }}
{{- $backends := list }}
{{- range $fleet.backends | default list }}
{{- $backends = append $backends . }}
{{- end }}
{{- if not $backends }}
{{- $legacyModel := $fleet.model | default dict }}
{{- $backends = list (dict "name" "native" "provider" ($legacyModel.provider | default "") "protocol" ($legacyModel.protocol | default "") "endpoint" ($legacyModel.endpoint | default "") "model" ($legacyModel.name | default "") "allowInsecure" ($legacyModel.allowInsecure | default false) "parameters" ($legacyModel.parameters | default dict) "maxOutputTokens" ($legacyModel.maxOutputTokens | default 0)) }}
{{- end }}
{{- if gt (len $backends) 32 }}
{{- fail "celln.fleet.backends allows at most 32 model backends per scope" }}
{{- end }}
{{- $backendNames := dict }}
{{- $backendExport := list }}
{{- /* What one turn of the costliest backend reserves: 6 model requests of
     its output cap (512 unless the backend sets maxOutputTokens). */}}
{{- $costliestTurn := int64 3072 }}
{{- $costliestBackend := "" }}
{{- range $b := $backends }}
{{- $name := $b.name | default "" }}
{{- if or (not (regexMatch "^[a-z0-9][a-z0-9-]{0,31}$" $name)) (hasKey $backendNames $name) }}
{{- fail (printf "celln.fleet.backends: names must be unique DNS labels of at most 32 characters: %q" $name) }}
{{- end }}
{{- $_ := set $backendNames $name true }}
{{- if or $b.credentialSecret $b.credentialPath }}
{{- fail (printf "celln.fleet.backends[%s]: credentialSecret/credentialPath are replaced by celln.fleet.modelCredentialsSecret keyed by backend name" $name) }}
{{- end }}
{{- $credential := printf "%s/%s" $credentialsDir $name }}
{{- $endpoint := $b.endpoint | default "" }}
{{- if and $endpoint (or (not $b.model) (not (has ($b.protocol | default "") (list "openai-chat" "anthropic-messages"))) (not $b.provider)) }}
{{- fail (printf "celln.fleet.backends[%s].endpoint needs provider, model and protocol openai-chat or anthropic-messages" $name) }}
{{- end }}
{{- if and $endpoint (hasPrefix "http://" $endpoint) (not $b.allowInsecure) }}
{{- fail (printf "celln.fleet.backends[%s].endpoint is plain HTTP; set allowInsecure=true to approve it" $name) }}
{{- end }}
{{- $export := dict "name" $name "provider" ($b.provider | default "") "protocol" ($b.protocol | default "") "endpoint" $endpoint "model" ($b.model | default "") "allowInsecure" ($b.allowInsecure | default false) "credentialFile" $credential }}
{{- /* Model parameters: an object, or the same object as one JSON string (what
     the installer sends, since --set values cannot carry an object). Only a
     backend that has some exports the key, so every other backend's plan,
     and this list's checksum, stay exactly as they were. Celln validates
     the object when it configures the node. */}}
{{- $parameters := $b.parameters | default dict }}
{{- if kindIs "string" $parameters }}
{{- $parameters = fromJson $parameters }}
{{- if hasKey $parameters "Error" }}
{{- fail (printf "celln.fleet.backends[%s].parameters is not a JSON object: %s" $name $parameters.Error) }}
{{- end }}
{{- end }}
{{- if not (kindIs "map" $parameters) }}
{{- fail (printf "celln.fleet.backends[%s].parameters must be an object" $name) }}
{{- end }}
{{- if $parameters }}
{{- if not $endpoint }}
{{- fail (printf "celln.fleet.backends[%s].parameters needs the backend's endpoint, provider, model and protocol" $name) }}
{{- end }}
{{- $_ := set $export "parameters" $parameters }}
{{- end }}
{{- /* Output tokens per model request: exported only when set and not
     Celln's default of 512, for the same reason. A turn reserves 6 requests
     of it, so the scope's lifetime ceiling must pay for at least one. */}}
{{- $maxOutputTokens := int64 ($b.maxOutputTokens | default 0) }}
{{- if and (ne $maxOutputTokens 0) (ne $maxOutputTokens 512) }}
{{- if or (lt $maxOutputTokens 256) (gt $maxOutputTokens 4096) }}
{{- fail (printf "celln.fleet.backends[%s].maxOutputTokens must be 256-4096 (omit it for the default 512)" $name) }}
{{- end }}
{{- if not $endpoint }}
{{- fail (printf "celln.fleet.backends[%s].maxOutputTokens needs the backend's endpoint, provider, model and protocol" $name) }}
{{- end }}
{{- $_ := set $export "maxOutputTokens" $maxOutputTokens }}
{{- if gt (mul 6 $maxOutputTokens) $costliestTurn }}
{{- $costliestTurn = mul 6 $maxOutputTokens }}
{{- $costliestBackend = $name }}
{{- end }}
{{- end }}
{{- $backendExport = append $backendExport $export }}
{{- end }}
{{- $limits := $fleet.limits | default dict }}
{{- $lease := int64 ($limits.leaseSeconds | default 0) }}
{{- if and (ne $lease 0) (or (lt $lease 60) (gt $lease 86400)) }}
{{- fail "celln.fleet.limits.leaseSeconds must be 60-86400" }}
{{- end }}
{{- $lifetimeTokens := int64 ($limits.maxOutputTokens | default 0) }}
{{- if and $costliestBackend (ne $lifetimeTokens 0) (lt $lifetimeTokens $costliestTurn) }}
{{- fail (printf "celln.fleet.limits.maxOutputTokens (%d) does not pay for one turn of backend %s, which reserves %d (6 requests x its maxOutputTokens); size it as turns x %d" $lifetimeTokens $costliestBackend $costliestTurn $costliestTurn) }}
{{- end }}
{{- $capacity := $fleet.capacity | default "auto" }}
{{- if not (has $capacity (list "auto" "fixed")) }}
{{- fail "celln.fleet.capacity must be auto or fixed" }}
{{- end }}
{{- if and (eq $capacity "fixed") (lt (int $fleet.maxCells) 2) }}
{{- fail "celln.fleet.maxCells must allow a parent and a child" }}
{{- end }}
{{- $memoryPercent := int ($fleet.memoryPercent | default 75) }}
{{- $cellMemoryBytes := int64 ($fleet.cellMemoryBytes | default 671088640) }}
{{- $maxCellsCeiling := int ($fleet.maxCellsCeiling | default 1024) }}
{{- if or (lt $memoryPercent 1) (gt $memoryPercent 95) (lt $cellMemoryBytes 268435456) (lt $maxCellsCeiling 2) }}
{{- fail "celln.fleet auto capacity needs memoryPercent 1-95, cellMemoryBytes >= 256 MiB and maxCellsCeiling >= 2" }}
{{- end }}
{{- $state := printf "/var/lib/sympozium-celln/%s" $fleet.scope }}
{{- $root := printf "%s/authority" $state }}
{{- $image := printf "%s:%s" (.Values.celln.image.repository | default "ghcr.io/sympozium-ai/sympozium/celln-installer") (.Values.celln.image.tag | default .Chart.AppVersion) }}
{{- $backendSecret := (.Values.celln.bootstrap | default dict).backendTokenSecret | default "celln-dispatcher-backend" }}
{{- $journal := $fleet.journal | default dict }}
{{- /* Mediated model access (celln.mediation): the owner's dispatcher also
     serves the scoped receiver, verifying permits against the operator's
     public JWKS and relaying model requests to the gateway. */}}
{{- $mediated := include "sympozium.cellnMediation" . }}
{{- $mediation := .Values.celln.mediation | default dict }}
{{- $parentRequestDefault := printf "%s/configuration-%s-%s/scoped-parent-request.json" $state (trimPrefix "blake3:" $package.hash) (index $backends 0).name }}
{{- $parentRequest := $mediation.parentRequestFile | default $parentRequestDefault }}
{{- if and $mediated (or (not (hasPrefix (printf "%s/" $state) $parentRequest)) (contains "/../" $parentRequest) (regexMatch "[[:space:]]" $parentRequest)) }}
{{- fail (printf "celln.mediation.parentRequestFile must be a file under the node state directory %s, the only host path the dispatcher mounts" $state) }}
{{- end }}
{{- if and $fleet.parentConfigSecret $journal.create }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $journal.claim | default "celln-parent-journal" | quote }}
  namespace: {{ include "sympozium.namespace" . }}
  labels:
    app.kubernetes.io/part-of: sympozium
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $journal.storage | default "1Gi" | quote }}
  {{- with $journal.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celln-node
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
automountServiceAccountToken: false
---
# The preparing node publishes the scope's starter configuration once; later
# nodes only read and compare it. Nothing else in the namespace is reachable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celln-node-configuration
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $fleet.configurationConfigMap | quote }}, {{ $fleet.cellsConfigMap | default "celln-fleet-cells" | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celln-node-configuration
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celln-node-configuration
subjects:
  - kind: ServiceAccount
    name: celln-node
    namespace: celln-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: celln-fleet-prepare
  namespace: celln-system
  labels:
    app.kubernetes.io/part-of: sympozium
data:
  prepare.sh: |
{{ .Files.Get "files/celln/fleet-prepare.sh" | indent 4 }}
  fleet-publish.py: |
{{ .Files.Get "files/celln/fleet-publish.py" | indent 4 }}
  fleet-plan.py: |
{{ .Files.Get "files/celln/fleet-plan.py" | indent 4 }}
  fleet-cells.sh: |
{{ .Files.Get "files/celln/fleet-cells.sh" | indent 4 }}
  fleet-cells.py: |
{{ .Files.Get "files/celln/fleet-cells.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: celln-node
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-node
    app.kubernetes.io/part-of: sympozium
spec:
  # Headless: the router resolves every ready owner's address itself and keeps
  # each parent bound to the address that issued it.
  clusterIP: None
  selector:
    app.kubernetes.io/name: celln-node
  ports:
    - name: http
      port: 8787
      targetPort: 8787
      protocol: TCP
---
# Prepares every labeled node from the reviewed package and configures each
# model backend, publishing the scope's starter configuration. Its template
# carries the backend list, so adding a backend rolls only this DaemonSet;
# the owner DaemonSet below keeps its parents. The pod then idles.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-node-configure
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-node-configure
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-node-configure
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-node-configure
      annotations:
        celln.sympozium.ai/package: {{ $package.hash | quote }}
        celln.sympozium.ai/scope: {{ $fleet.scope | quote }}
        celln.sympozium.ai/backends: {{ toJson $backendExport | sha256sum | quote }}
        # The API server bumps this when it adds a backend, rolling the
        # configure pods so they pick up the extra list.
        celln.sympozium.ai/backends-extra: {{ .Values.celln.fleet.backendsExtraRevision | default "" | quote }}
    spec:
      serviceAccountName: celln-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: configure
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Prepare the node once, then keep reporting its cells for the console.
          command: ["/bin/bash", "-ec", "/bin/bash /etc/celln-fleet/prepare.sh && exec /bin/bash /etc/celln-fleet/fleet-cells.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FLEET_STATE
              value: {{ $state | quote }}
            - name: FLEET_PACKAGE_IMAGE
              value: {{ $package.image | quote }}
            - name: FLEET_PACKAGE_HASH
              value: {{ $package.hash | quote }}
            - name: FLEET_PACKAGE_INSECURE
              value: {{ $package.insecureRegistry | default false | quote }}
            - name: FLEET_PUBLISHER
              value: {{ $fleet.publisher | quote }}
            - name: FLEET_PRINCIPAL
              value: {{ $fleet.principal | quote }}
            - name: FLEET_SCOPE
              value: {{ $fleet.scope | quote }}
            - name: FLEET_BACKENDS
              value: {{ toJson $backendExport | quote }}
            - name: FLEET_LIMIT_LEASE_SECONDS
              value: {{ $limits.leaseSeconds | default 0 | quote }}
            - name: FLEET_LIMIT_MAX_TURNS
              value: {{ $limits.maxTurns | default 0 | quote }}
            - name: FLEET_LIMIT_MAX_MODEL_REQUESTS
              value: {{ $limits.maxModelRequests | default 0 | quote }}
            - name: FLEET_LIMIT_MAX_OUTPUT_TOKENS
              value: {{ $limits.maxOutputTokens | default 0 | quote }}
            - name: FLEET_HTTPS_HOSTS
              value: {{ toJson ($fleet.httpsHosts | default list) | quote }}
            - name: FLEET_PARENT_CLIENTS
              value: /etc/celln-fleet/clients/trusted-parent-clients.json
            - name: FLEET_CONFIGURATION_CONFIGMAP
              value: {{ $fleet.configurationConfigMap | quote }}
            - name: FLEET_CELLS_CONFIGMAP
              value: {{ $fleet.cellsConfigMap | default "celln-fleet-cells" | quote }}
            - name: FLEET_NAMESPACE
              value: celln-system
          securityContext:
            privileged: true
          volumeMounts:
            - name: prepare
              mountPath: /etc/celln-fleet/prepare.sh
              subPath: prepare.sh
              readOnly: true
            - name: prepare
              mountPath: /etc/celln-fleet/fleet-publish.py
              subPath: fleet-publish.py
              readOnly: true
            - name: prepare
              mountPath: /etc/celln-fleet/fleet-plan.py
              subPath: fleet-plan.py
              readOnly: true
            - name: prepare
              mountPath: /etc/celln-fleet/fleet-cells.sh
              subPath: fleet-cells.sh
              readOnly: true
            - name: prepare
              mountPath: /etc/celln-fleet/fleet-cells.py
              subPath: fleet-cells.py
              readOnly: true
            - name: parent-clients
              mountPath: /etc/celln-fleet/clients
              readOnly: true
            - name: backends-extra
              mountPath: /etc/celln-fleet/backends-extra
              readOnly: true
            {{- if $package.pullSecret }}
            - name: registry
              mountPath: /etc/celln-fleet/registry
              readOnly: true
            {{- end }}
            - name: publisher-credentials
              mountPath: /var/run/secrets/celln-fleet
              readOnly: true
            # Read only to know when a backend's key has reached this node's
            # kubelet: a backend is published once its key file is present.
            - name: model-credentials
              mountPath: {{ $credentialsDir | quote }}
              readOnly: true
            - name: state
              mountPath: {{ $state | quote }}
            - name: kvm
              mountPath: /dev/kvm
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: model-credentials
          secret:
            secretName: {{ $credentialsSecret | quote }}
            defaultMode: 0400
            optional: true
        - name: prepare
          configMap:
            name: celln-fleet-prepare
            defaultMode: 0555
        - name: parent-clients
          configMap:
            name: {{ $fleet.parentClientsConfigMap | quote }}
        # Backends added through the API after the install; absent until then.
        - name: backends-extra
          configMap:
            name: celln-fleet-backends-extra
            optional: true
        {{- if $package.pullSecret }}
        - name: registry
          secret:
            secretName: {{ $package.pullSecret | quote }}
            defaultMode: 0400
        {{- end }}
        # Only this configuring step may reach the API; the owner gets no token.
        - name: publisher-credentials
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: state
          hostPath:
            path: {{ $state | quote }}
            type: DirectoryOrCreate
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: celln-node
  namespace: celln-system
  labels:
    app.kubernetes.io/name: celln-node
    app.kubernetes.io/part-of: sympozium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: celln-node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celln-node
      annotations:
        celln.sympozium.ai/package: {{ $package.hash | quote }}
    spec:
      serviceAccountName: celln-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        celln.dev/kvm: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        # The node-configure DaemonSet prepares the authority root (package
        # admission, model backends). This owner only waits for admission so a
        # backend change never rolls it; new model profiles are read from the
        # root at provision time and new keys arrive through the Secret mount.
        - name: wait-prepared
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              # "Not prepared yet" is worth waiting for; "cannot read the state
              # directory" never resolves by waiting. This container is root
              # without capabilities, so a directory an older install left to
              # another uid (mode 0700) is closed to it. Listing "dir/." needs
              # both read and search, which is what the tests below rely on.
              for dir in "$FLEET_STATE" "$FLEET_STATE/authority"; do
                if [ -d "$dir" ] && ! ls -A "$dir/." >/dev/null 2>&1; then
                  echo "cannot read the Celln state directory $dir on node $NODE_NAME: owner $(stat -c '%u:%g mode %a' "$dir" 2>/dev/null || echo unknown), this container runs as uid $(id -u) without capabilities." >&2
                  echo "It was probably left by an older install. celln-node-configure resets the owner on its next pass and this pod then starts by itself." >&2
                  echo "If it does not, on the node either move it aside (sudo mv $FLEET_STATE $FLEET_STATE.old) or sudo chown 0:0 $dir && sudo chmod 0700 $dir; with SELinux enforcing also: sudo chcon -R -t container_file_t $FLEET_STATE" >&2
                  exit 1
                fi
              done
              until [ -f "$FLEET_STATE/admitted-$FLEET_PACKAGE_HEX" ] && [ -f "$FLEET_STATE/authority/trusted-parent-clients.json" ]; do
                echo "waiting for celln-node-configure to admit package $FLEET_PACKAGE_HEX on this node" >&2
                sleep 5
              done
              {{- if and $mediated (eq $parentRequest $parentRequestDefault) }}
              # The dispatcher reads the scoped parent request once, at start:
              # wait for the configuration that carries it rather than start
              # one-shot-only because node configuration was still running.
              until [ -f "$(dirname "$SCOPED_PARENT_REQUEST")/configured.json" ]; do
                echo "waiting for celln-node-configure to configure $(dirname "$SCOPED_PARENT_REQUEST")" >&2
                sleep 5
              done
              {{- end }}
          env:
            {{- if $mediated }}
            - name: SCOPED_PARENT_REQUEST
              value: {{ $parentRequest | quote }}
            {{- end }}
            - name: FLEET_STATE
              value: {{ $state | quote }}
            - name: FLEET_PACKAGE_HEX
              value: {{ trimPrefix "blake3:" $package.hash | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: {{ $state | quote }}
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: dispatcher
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq $capacity "auto" }}
          # Size this node when the dispatcher starts: a share of the node's
          # memory (its cgroup limit when set), cells from the per-cell
          # declaration, and one broker slot per cell. A parent charges two
          # cells, two broker slots and its declared memory.
          command:
            - /bin/sh
            - -ec
            - |
              total=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) * 1024 ))
              node=$total
              limit=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
              if [ -n "$limit" ] && [ "$limit" != max ] && [ "$limit" -lt "$total" ]; then node=$limit; fi
              memory=$(( node / 100 * {{ $memoryPercent }} ))
              cells=$(( memory / {{ $cellMemoryBytes }} ))
              [ "$cells" -le {{ $maxCellsCeiling }} ] || cells={{ $maxCellsCeiling }}
              if [ "$cells" -lt 2 ]; then
                echo "celln capacity: node memory $node bytes cannot hold a parent and its child" >&2
                exit 1
              fi
              echo "celln capacity: node=$node memory=$memory cells=$cells egressSlots=$cells" >&2
              {{- if $mediated }}
              {{- include "sympozium.cellnScopedParentRequestArg" . | nindent 14 }}
              {{- end }}
              exec /usr/local/bin/celln "$@" --max-cells "$cells" --memory-bytes "$memory" --egress-slots "$cells"
            - celln-dispatcher
          {{- else if $mediated }}
          command:
            - /bin/sh
            - -ec
            - |
              {{- include "sympozium.cellnScopedParentRequestArg" . | nindent 14 }}
              exec /usr/local/bin/celln "$@"
            - celln-dispatcher
          {{- else }}
          command: ["/usr/local/bin/celln"]
          {{- end }}
          args:
            - dispatcher
            - --listen
            - 0.0.0.0:8787
            - --unsafe-non-loopback
            - --token-file
            - /etc/celln/backend/token
            - --root
            - {{ $root | quote }}
            - --mote-store
            - {{ printf "%s/motes" $root | quote }}
            - --tool-store
            - {{ printf "%s/tools" $root | quote }}
            - --node-name
            - $(NODE_NAME)
            {{- range $fleet.allowEgressHosts | default (list "api.deepseek.com") }}
            - --allow-egress-host
            - {{ . | quote }}
            {{- end }}
            {{- if eq $capacity "fixed" }}
            - --max-cells
            - {{ $fleet.maxCells | int | quote }}
            - --memory-bytes
            - {{ $fleet.memoryBytes | int64 | quote }}
            - --egress-slots
            - {{ $fleet.egressSlots | default $fleet.maxCells | quote }}
            {{- end }}
            {{- if $mediated }}
            - --scoped-operator-token-file
            - /etc/celln/scoped/operator-token
            # Celln opens the JWKS without following a final symlink, and a
            # projected key is one; the kubelet's ..data directory holds the
            # regular file and still follows a rotated ConfigMap.
            - --scoped-jwks-file
            - /etc/celln/scoped-trust/..data/jwks.json
            - --scoped-issuer
            - {{ $mediation.issuer.name | quote }}
            - --scoped-gateway-origin
            - {{ include "sympozium.modelGatewayOrigin" . | quote }}
            - --scoped-gateway-ca
            - /etc/celln/scoped-trust/ca.crt
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if $mediated }}
            - name: SCOPED_PARENT_REQUEST
              value: {{ $parentRequest | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8787
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    printf 'Authorization: Bearer %s\n' "$(cat /etc/celln/backend/token)" | curl --fail --silent --show-error --max-time 50 --header @- --request POST http://127.0.0.1:8787/v1/drain
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: backend
              mountPath: /etc/celln/backend
              readOnly: true
            - name: state
              mountPath: {{ $state | quote }}
            - name: model-credentials
              mountPath: {{ $credentialsDir | quote }}
              readOnly: true
            - name: kvm
              mountPath: /dev/kvm
            - name: boot
              mountPath: /boot
              readOnly: true
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $mediated }}
            - name: scoped-operator
              mountPath: /etc/celln/scoped
              readOnly: true
            - name: scoped-trust
              mountPath: /etc/celln/scoped-trust
              readOnly: true
            {{- end }}
        {{- if $mediated }}
        # The dispatcher speaks plaintext HTTP and the controller only talks to
        # an HTTPS receiver with a pinned CA. This unprivileged edge terminates
        # TLS and forwards nothing but POST /v1/scoped/* to the dispatcher on
        # loopback; the operator bearer and signed permits remain the authority.
        - name: scoped-receiver
          image: {{ include "sympozium.controllerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/celln-parent-proxy"]
          args:
            - --scoped-receiver
            - --listen
            - {{ printf "0.0.0.0:%d" (int (($mediation.receiver | default dict).port | default 9443)) | quote }}
            - --backend
            - http://127.0.0.1:8787
            - --tls-cert
            - /etc/celln/receiver-tls/tls.crt
            - --tls-key
            - /etc/celln/receiver-tls/tls.key
          ports:
            - name: scoped-https
              containerPort: {{ int (($mediation.receiver | default dict).port | default 9443) }}
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          volumeMounts:
            - name: scoped-receiver-tls
              mountPath: /etc/celln/receiver-tls
              readOnly: true
        {{- end }}
      volumes:
        {{- if $mediated }}
        - name: scoped-operator
          secret:
            secretName: {{ $mediation.nodeSecret | quote }}
            defaultMode: 0400
            items:
              - key: operator-token
                path: operator-token
        # Public: the issuer's JWKS and the CA that signed the gateway.
        - name: scoped-trust
          configMap:
            name: {{ $mediation.trustConfigMap | quote }}
        # Readable by the non-root edge (UID 65532), which alone mounts it; a
        # Secret volume cannot be owned by that user.
        - name: scoped-receiver-tls
          secret:
            secretName: {{ $mediation.nodeSecret | quote }}
            defaultMode: 0444
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        - name: backend
          secret:
            secretName: {{ $backendSecret | quote }}
            defaultMode: 0440
        # Every backend's key, one file per backend; Secret changes reach the
        # mount without a restart because no subPath is used.
        - name: model-credentials
          secret:
            secretName: {{ $credentialsSecret | quote }}
            defaultMode: 0400
        - name: state
          hostPath:
            path: {{ $state | quote }}
            type: DirectoryOrCreate
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: boot
          hostPath:
            path: /boot
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: tmp
          emptyDir: {}
{{- end }}
