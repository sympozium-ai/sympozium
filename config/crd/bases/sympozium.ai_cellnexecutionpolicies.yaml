---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: cellnexecutionpolicies.sympozium.ai
spec:
  group: sympozium.ai
  names:
    kind: CellnExecutionPolicy
    listKind: CellnExecutionPolicyList
    plural: cellnexecutionpolicies
    singular: cellnexecutionpolicy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CellnExecutionPolicySpec maps protected namespace labels to an intersection of
              exact catalogue revisions, model routes, lifecycle modes, and hard ceilings.
              Empty tools means no tool authority; it does not make an otherwise valid
              tool-free direct request invalid.
            properties:
              ceilings:
                properties:
                  maxModelRequests:
                    format: int64
                    maximum: 6144
                    minimum: 0
                    type: integer
                  maxOutputTokens:
                    format: int64
                    maximum: 3145728
                    minimum: 0
                    type: integer
                  maxParentLeaseSeconds:
                    format: int64
                    maximum: 86400
                    minimum: 1
                    type: integer
                  maxTurnSeconds:
                    format: int64
                    maximum: 3600
                    minimum: 1
                    type: integer
                  maxTurns:
                    format: int64
                    maximum: 1024
                    minimum: 1
                    type: integer
                required:
                - maxModelRequests
                - maxOutputTokens
                - maxParentLeaseSeconds
                - maxTurnSeconds
                - maxTurns
                type: object
              lifecycles:
                items:
                  enum:
                  - direct-one-shot
                  - harness-one-shot
                  - enduring
                  type: string
                maxItems: 3
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              namespaceSelector:
                description: |-
                  A label selector is a label query over a set of resources. The result of matchLabels and
                  matchExpressions are ANDed. An empty label selector matches all objects. A null
                  label selector matches no objects.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              routes:
                items:
                  description: |-
                    CellnExecutionPolicyRoute is explicit model endpoint authority. A tenant
                    ModelConnection may choose only a route contained by one of these entries.
                  properties:
                    auth:
                      enum:
                      - secret
                      - none
                      type: string
                    endpointOrigins:
                      items:
                        type: string
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    models:
                      items:
                        type: string
                      maxItems: 32
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    protocol:
                      enum:
                      - openai-chat
                      - anthropic-messages
                      type: string
                    provider:
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - auth
                  - endpointOrigins
                  - models
                  - protocol
                  - provider
                  type: object
                  x-kubernetes-validations:
                  - message: credential-bearing routes require https; http is restricted
                      to explicit no-auth loopback origins
                    rule: self.endpointOrigins.all(x, x.startsWith('https://') ||
                      (self.auth == 'none' && (x.startsWith('http://127.0.0.1') ||
                      x.startsWith('http://localhost') || x.startsWith('http://[::1]'))))
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              runtimeProfiles:
                items:
                  description: |-
                    CellnExecutionPolicyRuntime permits an exact shared runtime revision and may
                    narrow its numeric ceilings. The resolver enforces that the override cannot
                    raise the referenced profile's ceilings.
                  properties:
                    limits:
                      description: |-
                        AgentRuntimeCellnLimits are ceilings, never Agent grants or provider policy.
                        Model mediation and tools retain their selected adapter's dispatch contract;
                        this profile cannot add protocols, tools or destinations.
                      properties:
                        memoryBytes:
                          format: int64
                          maximum: 268435456
                          minimum: 1
                          type: integer
                        outputBytes:
                          format: int64
                          maximum: 65536
                          minimum: 1
                          type: integer
                        taskBytes:
                          format: int64
                          maximum: 2048
                          minimum: 1
                          type: integer
                        timeoutMillis:
                          format: int64
                          maximum: 300000
                          minimum: 1
                          type: integer
                        workspace:
                          enum:
                          - none
                          type: string
                      required:
                      - memoryBytes
                      - outputBytes
                      - taskBytes
                      - timeoutMillis
                      - workspace
                      type: object
                    ref:
                      description: |-
                        CellnRuntimeProfileRef identifies one immutable operator-published runtime
                        revision. Name alone is never sufficient authority.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          type: string
                        revision:
                          maxLength: 64
                          minLength: 1
                          type: string
                      required:
                      - name
                      - revision
                      type: object
                  required:
                  - ref
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              tools:
                items:
                  description: |-
                    CellnExecutionPolicyTool permits an exact shared tool revision and may narrow
                    that tool's declared constraints.
                  properties:
                    limits:
                      description: CellnToolLimits are maximum requested/admitted
                        ceilings, not grants.
                      properties:
                        argumentBytes:
                          format: int64
                          maximum: 65536
                          minimum: 1
                          type: integer
                        artifacts:
                          description: Artifacts grants logical run-owned data operations,
                            never host mounts.
                          properties:
                            maxFileBytes:
                              format: int64
                              maximum: 4096
                              minimum: 1
                              type: integer
                            maxFiles:
                              format: int64
                              maximum: 256
                              minimum: 1
                              type: integer
                            maxOperations:
                              format: int64
                              maximum: 64
                              minimum: 1
                              type: integer
                            maxTotalBytes:
                              format: int64
                              maximum: 1048576
                              minimum: 1
                              type: integer
                            operation:
                              enum:
                              - read
                              - write
                              type: string
                          required:
                          - maxFileBytes
                          - maxFiles
                          - maxOperations
                          - maxTotalBytes
                          - operation
                          type: object
                        effects:
                          enum:
                          - none
                          - external-side-effects
                          type: string
                        egress:
                          items:
                            type: string
                          maxItems: 0
                          type: array
                        https:
                          description: HTTPS grants bounded credential-free GET via
                            the host broker.
                          properties:
                            allowHosts:
                              items:
                                type: string
                              maxItems: 16
                              minItems: 1
                              type: array
                            maxRequests:
                              format: int64
                              maximum: 16
                              minimum: 1
                              type: integer
                            maxResponseBytes:
                              format: int64
                              maximum: 4096
                              minimum: 1
                              type: integer
                            timeoutMillis:
                              format: int64
                              maximum: 30000
                              minimum: 1
                              type: integer
                          required:
                          - allowHosts
                          - maxRequests
                          - maxResponseBytes
                          - timeoutMillis
                          type: object
                        inputs:
                          items:
                            properties:
                              hash:
                                maxLength: 71
                                pattern: ^blake3:[0-9a-f]{64}$
                                type: string
                            required:
                            - hash
                            type: object
                          maxItems: 0
                          type: array
                        memoryBytes:
                          format: int64
                          maximum: 268435456
                          minimum: 1
                          type: integer
                        outputBytes:
                          format: int64
                          maximum: 65536
                          minimum: 1
                          type: integer
                        timeoutMillis:
                          format: int64
                          maximum: 300000
                          minimum: 1
                          type: integer
                        workspace:
                          description: |-
                            Workspaces/immutable inputs and remote operations require a separately
                            implemented tool-delivery contract; this schema cannot silently grant them.
                          enum:
                          - none
                          type: string
                      required:
                      - argumentBytes
                      - effects
                      - memoryBytes
                      - outputBytes
                      - timeoutMillis
                      - workspace
                      type: object
                    ref:
                      description: |-
                        ClusterCellnToolRef is an unambiguous reference to a cluster-scoped tool
                        catalogue revision. It is intentionally distinct from CellnCatalogueToolRef,
                        which continues to mean the legacy namespaced CellnTool API.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                          type: string
                        revision:
                          maxLength: 64
                          minLength: 1
                          type: string
                      required:
                      - name
                      - revision
                      type: object
                  required:
                  - ref
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
            required:
            - ceilings
            - lifecycles
            - namespaceSelector
            - routes
            - runtimeProfiles
            - tools
            type: object
            x-kubernetes-validations:
            - message: runtime profile names must be unique within a policy
              rule: self.runtimeProfiles.all(x, self.runtimeProfiles.filter(y, y.ref.name
                == x.ref.name).size() == 1)
            - message: cluster tool names must be unique within a policy
              rule: self.tools.all(x, self.tools.filter(y, y.ref.name == x.ref.name).size()
                == 1)
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
